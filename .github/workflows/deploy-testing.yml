# CD Pipeline - Deploy to Testing Environment
name: CD - Deploy to Testing

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ml-visualizer-testing
  ACR_NAME: mlvisualizerregistry
  IMAGE_NAME: ml-visualizer
  RESOURCE_GROUP: ml-visualizer-rg

jobs:
  build-and-deploy:
    name: Build and Deploy to Testing
    runs-on: ubuntu-latest
    environment: testing
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        VERSION=$(cat VERSION)
        SHORT_SHA=$(git rev-parse --short HEAD)
        BUILD_VERSION="${VERSION}-test-${SHORT_SHA}"
        echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_OUTPUT
        echo "Deploying version: $BUILD_VERSION"

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.BUILD_VERSION }}
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:testing-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.BUILD_VERSION }}

    - name: Wait for deployment
      run: sleep 30

    - name: Health check
      run: |
        ENDPOINT="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/_stcore/health"
        echo "Checking health endpoint: $ENDPOINT"
        for i in {1..10}; do
          if curl --fail --max-time 10 "$ENDPOINT"; then
            echo "Health check passed!"
            exit 0
          fi
          echo "Attempt $i failed, retrying in 10s..."
          sleep 10
        done
        echo "Health check failed after 10 attempts"
        exit 1

    - name: Notify deployment
      if: always()
      run: |
        echo "Deployment to testing completed with status: ${{ job.status }}"
        echo "Version: ${{ steps.version.outputs.BUILD_VERSION }}"
        echo "URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
