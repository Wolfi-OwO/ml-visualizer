# CD Pipeline - Deploy to Production Environment
name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: false

env:
  AZURE_WEBAPP_NAME: ml-visualizer-prod
  ACR_NAME: mlvisualizerregistry
  IMAGE_NAME: ml-visualizer
  RESOURCE_GROUP: ml-visualizer-rg

jobs:
  approval:
    name: Require Approval
    runs-on: ubuntu-latest
    environment: production-approval
    steps:
    - name: Wait for approval
      run: echo "Manual approval required for production deployment"

  build-and-deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest
    needs: [approval]
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set version
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION=$(cat VERSION)
        fi
        SHORT_SHA=$(git rev-parse --short HEAD)
        BUILD_VERSION="${VERSION}-${SHORT_SHA}"
        echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_OUTPUT
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Deploying version: $BUILD_VERSION"

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.BUILD_VERSION }}
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create backup slot
      run: |
        az webapp deployment slot create \
          --name ${{ env.AZURE_WEBAPP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --slot backup-$(date +%Y%m%d-%H%M%S) \
          --configuration-source ${{ env.AZURE_WEBAPP_NAME }} || true

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        images: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.BUILD_VERSION }}

    - name: Wait for deployment
      run: sleep 45

    - name: Health check
      run: |
        ENDPOINT="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/_stcore/health"
        echo "Checking health endpoint: $ENDPOINT"
        for i in {1..15}; do
          if curl --fail --max-time 10 "$ENDPOINT"; then
            echo "Health check passed!"
            exit 0
          fi
          echo "Attempt $i failed, retrying in 10s..."
          sleep 10
        done
        echo "Health check failed after 15 attempts"
        exit 1

    - name: Run production smoke tests
      run: |
        echo "Running production smoke tests..."
        curl --fail https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net || exit 1
        # Add comprehensive smoke tests here

    - name: Tag release
      if: success()
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a "v${{ steps.version.outputs.VERSION }}-deployed" -m "Production deployment $(date)"
        git push origin "v${{ steps.version.outputs.VERSION }}-deployed" || true

    - name: Notify deployment
      if: always()
      run: |
        echo "Deployment to production completed with status: ${{ job.status }}"
        echo "Version: ${{ steps.version.outputs.BUILD_VERSION }}"
        echo "URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

    - name: Rollback on failure
      if: failure()
      run: |
        echo "Deployment failed! Consider manual rollback if needed."
        # Add automated rollback logic here if desired
