# Docker Compose for testing environment
# Usage: docker-compose -f docker-compose.test.yml up

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-visualizer-test
    ports:
      - "8501:8080"
    env_file:
      - ./config/testing.env
    environment:
      - ENVIRONMENT_NAME=testing
    restart: unless-stopped
    networks:
      - ml-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ml-network:
    driver: bridge
