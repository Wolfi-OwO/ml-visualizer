# Preview app config for the DSAI webapp, sourced by /opt/previews/create.sh
# and destroy.sh. Installed at /opt/previews/apps/dsai.conf.
REPO="WoofiOwO/5bhif-datascience-webapp"
IMAGE="registry.gitlab.com/woofiowo/5bhif-datascience-webapp"

# First-guess budget, same as production's slot; re-measure with docker stats.
MEM_LIMIT="512m"
CPU_LIMIT="0.4"

# The app is stateless and reads no secrets; the env file only marks the
# environment.
ENV_FILE="/opt/previews/apps/dsai.env"
