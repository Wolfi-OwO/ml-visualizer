# =====================================================
# GitLab CI/CD Pipeline
# =====================================================
# Builds the image into the project's own GitLab registry and deploys it to
# the Contabo VPS over SSH. Nothing here talks to Azure.
#
#   merge request  -> build image (tag = short SHA), manual "deploy-review"
#                     starts a throwaway preview container on the VPS
#   v* tag         -> build image (tag = git tag), manual "deploy-production"
#                     does a blue/green rollout on the VPS
#
# The VPS side (compose file, deploy.sh, Caddy block, preview app config) is
# versioned in infrastructure/vps/ and described in its README.
# =====================================================

include:
  # Security scanning templates
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

stages:
  - validate
  - lint
  - test
  - security
  - build
  - deploy:review
  - deploy:production
  - release
  - pages

image: alpine:latest

variables:
  # Built-in registry, no credentials to manage: CI_REGISTRY_* are injected per job.
  DOCKER_IMAGE_URI: "${CI_REGISTRY_IMAGE}"
  LATEST_TAG: "latest"
  DEPLOY_USER: "deploy"

  # Health Check Configuration
  HEALTH_CHECK_TIMEOUT: "300"
  HEALTH_CHECK_INTERVAL: "10"

# =====================================================
# VALIDATION STAGE
# =====================================================

.validate_base:
  stage: validate
  rules:
    # Run for merge requests and main branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_TAG

check-variables:
  extends: .validate_base
  image: alpine:latest
  script:
    - |
      echo "Validating CI variables..."
      echo "✓ Registry image: $DOCKER_IMAGE_URI"
      echo "✓ CI_COMMIT_REF_SLUG: $CI_COMMIT_REF_SLUG"

      # The deploy key is protected, so it only exists on protected refs/tags.
      missing=0
      for var in VPS_HOST VPS_KNOWN_HOSTS VPS_PREVIEW_KEY PRODUCTION_URL; do
        if eval "[ -z \"\$$var\" ]"; then
          echo "✗ Missing variable: $var"
          missing=1
        else
          echo "✓ $var: [set]"
        fi
      done
      if [ -n "$CI_COMMIT_TAG" ] && [ -z "$VPS_DEPLOY_KEY" ]; then
        echo "✗ Missing protected variable: VPS_DEPLOY_KEY"
        missing=1
      fi
      [ "$missing" = "0" ] || exit 1

      echo "OK: Variable validation completed"

check-dockerfile:
  extends: .validate_base
  image: alpine:latest
  script:
    - |
      echo "✓ Checking Dockerfile..."
      [ -f "Dockerfile" ] || exit 1
      echo "✓ Dockerfile found"

      echo "✓ Checking requirements.txt..."
      [ -f "requirements.txt" ] || exit 1
      echo "✓ requirements.txt found"

      echo "OK: All required files present"

# =====================================================
# LINT STAGE
# =====================================================

.lint_base:
  extends: .validate_base
  stage: lint

ruff-check:
  extends: .lint_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir ruff
  script:
    - |
      echo "Running ruff linting..."
      ruff check . --output-format=gitlab > ruff-report.json || RUFF_EXIT=$?

      echo "=== Ruff Linting Results ===" > ruff-results.txt
      ruff check . --output-format=text >> ruff-results.txt || true

      if [ -s "ruff-report.json" ]; then
        echo "⚠ Ruff found issues - check Code Quality tab" >> ruff-results.txt
        cat ruff-report.json >> ruff-results.txt
      else
        echo "✓ No ruff issues found" >> ruff-results.txt
      fi
  artifacts:
    when: always
    paths:
      - ruff-results.txt
    reports:
      codequality: ruff-report.json
    expire_in: 1 week

# =====================================================
# TEST STAGE
# =====================================================

.test_base:
  extends: .validate_base
  stage: test

syntax-check:
  extends: .test_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - |
      echo "✓ Running Python syntax checks..."
      python -m py_compile ./src/app.py
      for file in ./src/pages/*.py; do
        python -m py_compile "$file"
      done

      echo "✓ Checking imports..."
      python -c "import streamlit; import numpy; import pandas; import matplotlib; print('✓ All imports available')"

      echo "OK: Syntax checks passed"

unit-tests:
  extends: .test_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - |
      echo "Running unit tests with pytest and coverage..."
      python -m pytest src/tests/ -v --tb=short \
        --cov=. \
        --cov-config=pyproject.toml \
        --cov-report=term-missing \
        --cov-report=xml:coverage.xml \
        --cov-report=html:htmlcov \
        --junitxml=junit.xml || TEST_EXIT=$?

      if [ -z "$TEST_EXIT" ]; then
        echo "✓ All tests passed"
      else
        exit $TEST_EXIT
      fi
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - htmlcov/
      - junit.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit.xml
    expire_in: 1 week

# =====================================================
# SECURITY SCANNING STAGE
# =====================================================
# Uses official GitLab templates for security scanning

.security_base:
  extends: .validate_base
  stage: security
  allow_failure: true

bandit-scan:
  extends: .security_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir bandit
  script:
    - |
      echo "Running Bandit security scanner..."
      bandit -r . -f json -o bandit-report.json --exclude ./tests,./htmlcov,./.pytest_cache || true
      bandit -r . -f txt --exclude ./tests,./htmlcov,./.pytest_cache > security-report.txt 2>&1 || true

      HIGH_ISSUES=$(bandit -r . -f json --exclude ./tests,./htmlcov,./.pytest_cache 2>/dev/null | \
                   python -c "import sys,json; d=json.load(sys.stdin); print(len([r for r in d.get('results',[]) if r.get('issue_severity')=='HIGH']))" 2>/dev/null || echo "0")

      if [ "$HIGH_ISSUES" != "0" ]; then
        echo "⚠ Found $HIGH_ISSUES high severity security issues"
      else
        echo "✓ No high severity security issues found"
      fi
  artifacts:
    when: always
    paths:
      - security-report.txt
      - bandit-report.json
    expire_in: 1 week

dependency-audit:
  extends: .security_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir pip-audit
  script:
    - |
      echo "Checking for vulnerable dependencies..."
      pip-audit -r requirements.txt --format json > pip-audit.json 2>&1 || true
      pip-audit -r requirements.txt > dependency-report.txt 2>&1 || true

      VULN_COUNT=$(python -c "import json; d=json.load(open('pip-audit.json')); print(len(d.get('dependencies', [])))" 2>/dev/null || echo "0")

      if [ "$VULN_COUNT" != "0" ]; then
        echo "⚠ Found $VULN_COUNT vulnerable dependencies"
      else
        echo "✓ No known vulnerabilities found"
      fi
  artifacts:
    when: always
    paths:
      - dependency-report.txt
      - pip-audit.json
    expire_in: 1 week


# =====================================================
# BUILD STAGE - image into the GitLab registry
# =====================================================

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      # Tag builds are releases (tag = git tag); MR builds are previews (tag = short SHA).
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi
      echo "$IMAGE_TAG" > image_tag.txt

      docker build \
        -f Dockerfile \
        --build-arg APP_VERSION="${IMAGE_TAG}" \
        -t "${DOCKER_IMAGE_URI}:${IMAGE_TAG}" \
        .
      docker push "${DOCKER_IMAGE_URI}:${IMAGE_TAG}"

      # "latest" only ever points at a release, never at an MR preview build.
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "${DOCKER_IMAGE_URI}:${IMAGE_TAG}" "${DOCKER_IMAGE_URI}:${LATEST_TAG}"
        docker push "${DOCKER_IMAGE_URI}:${LATEST_TAG}"
      fi
      echo "✓ Pushed ${DOCKER_IMAGE_URI}:${IMAGE_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  artifacts:
    when: on_success
    access: all
    paths:
      - image_tag.txt
    expire_in: 1 day

# =====================================================
# DEPLOY - REVIEW (merge request previews on the VPS)
# =====================================================
# /opt/previews/run.sh on the VPS is the only thing the preview key can run.
# One container per merge request, replaced on every push; it is removed
# when the MR is merged or closed (environment on_stop) or by stop-review.
# URL: https://pr-<MR>.dsai.preview.woofi-developments.at (basic auth, see
# infrastructure/vps/README.md).

.ssh_setup: &ssh_setup
  - apk add --no-cache openssh-client curl
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh
  - printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
  # GitLab writes file variables as 0666 and ssh refuses such a key, so copy it.
  - |
    for v in VPS_DEPLOY_KEY VPS_PREVIEW_KEY; do
      eval "src=\${$v:-}"
      [ -n "$src" ] && install -m 600 "$src" ~/.ssh/$v
    done

deploy-review:
  stage: deploy:review
  needs:
    - job: docker-build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    url: https://pr-$CI_MERGE_REQUEST_IID.dsai.preview.woofi-developments.at
    on_stop: stop-review
    auto_stop_in: 3 days
  before_script:
    - *ssh_setup
  script:
    - |
      IMAGE_TAG=$(cat image_tag.txt)
      ssh -i ~/.ssh/VPS_PREVIEW_KEY "${DEPLOY_USER}@${VPS_HOST}" \
        "create dsai ${CI_MERGE_REQUEST_IID} ${CI_COMMIT_SHORT_SHA} ${IMAGE_TAG}"

stop-review:
  stage: deploy:review
  needs: []
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    action: stop
  before_script:
    - *ssh_setup
  script:
    - ssh -i ~/.ssh/VPS_PREVIEW_KEY "${DEPLOY_USER}@${VPS_HOST}" "destroy dsai ${CI_MERGE_REQUEST_IID}"

# =====================================================
# DEPLOY - PRODUCTION (blue/green on the VPS)
# =====================================================
# /opt/dsai/deploy.sh is the only command the deploy key can run. It pulls the
# tag, starts the idle slot, waits for Streamlit's health endpoint, flips
# Caddy and removes the old slot; a failed health check leaves the live slot
# untouched. Rolling back is re-running this job for an older tag.

deploy-production:
  stage: deploy:production
  needs:
    - job: docker-build
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  environment:
    name: production
    url: $PRODUCTION_URL
  before_script:
    - *ssh_setup
  script:
    - |
      IMAGE_TAG=$(cat image_tag.txt)
      echo "Deploying ${IMAGE_TAG} to ${VPS_HOST}..."
      ssh -i ~/.ssh/VPS_DEPLOY_KEY "${DEPLOY_USER}@${VPS_HOST}" "${IMAGE_TAG}"
    - |
      # deploy.sh already gated the cutover on a healthy container; this is the
      # end-to-end check through DNS, TLS and Caddy.
      attempts=$((HEALTH_CHECK_TIMEOUT / HEALTH_CHECK_INTERVAL))
      for i in $(seq 1 "$attempts"); do
        if [ "$(curl -s -o /dev/null -w '%{http_code}' "${PRODUCTION_URL}/_stcore/health")" = "200" ]; then
          echo "✓ ${PRODUCTION_URL} is healthy (attempt $i)"
          exit 0
        fi
        echo "  attempt $i: not healthy yet, retrying..."
        sleep "$HEALTH_CHECK_INTERVAL"
      done
      echo "✗ ${PRODUCTION_URL} never answered 200 on /_stcore/health"
      exit 1


# =====================================================
# PAGES - Static Landing Page (GitLab Pages)
# =====================================================
# Publishes landing/ as the GitLab Pages site for this project.
# Once a custom domain is attached in Settings > Pages, this becomes
# the site served at the domain apex (ml-visualizer.at) while the
# Streamlit app itself keeps running unchanged on its own subdomain.

pages:
  stage: pages
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - mkdir -p public
    - cp -r landing/. public/
  artifacts:
    paths:
      - public
