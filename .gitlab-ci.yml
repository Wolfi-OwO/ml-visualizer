stages:
  - validate
  - lint
  - test
  - security
  - build
  - push:staging
  - deploy:staging
  - deploy:production
  - release

image: mcr.microsoft.com/azure-cli:latest

variables:
  DOCKER_IMAGE_NAME: "ml-visualizer"
  DOCKER_REGISTRY: "${ACR_NAME}.azurecr.io"
  DOCKER_IMAGE_URI: "${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}"
  VERSION: "${CI_COMMIT_SHORT_SHA}"
  LATEST_TAG: "latest"
  APP_DIR: "."
  VERSION_FILE: "VERSION"

  # Environment Configuration
  STAGING_WEBAPP_NAME: "${AZURE_WEBAPP_NAME}-staging-${VERSION}"
  PRODUCTION_WEBAPP_NAME: "${AZURE_WEBAPP_NAME}"

  # Health Check Configuration
  HEALTH_CHECK_TIMEOUT: "300"
  HEALTH_CHECK_INTERVAL: "10"

  # Deployment Configuration
  DEPLOYMENT_TIMEOUT: "600"
  ROLLBACK_TIMEOUT: "300"

check-variables:
  stage: validate
  image: alpine:latest
  script:
    - |
      echo "Checking required GitLab CI/CD variables..."
      echo "Note: Some variables may be protected and only available on protected branches"
      MISSING=0

      # Check if ACR_NAME is available (should be non-protected)
      if [ -z "$ACR_NAME" ]; then
        echo "Warning: ACR_NAME variable not set"
        MISSING=1
      else
        echo "ACR_NAME is configured"
      fi

      # For protected variables, we can only check on main/protected branches
      if [ "$CI_COMMIT_REF_NAME" = "main" ] || [ "$CI_COMMIT_REF_PROTECTED" = "true" ]; then
        echo "Running on protected branch: $CI_COMMIT_REF_NAME"
        for var in AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_WEBAPP_NAME; do
          eval val=\$$var
          if [ -z "$val" ]; then
            echo "Error: Missing protected variable $var"
            MISSING=1
          else
            echo "$var is configured"
          fi
        done
      else
        echo "Running on non-protected branch: $CI_COMMIT_REF_NAME"
        echo "Protected variables will only be available on main branch or protected branches"
        echo "Validation will be skipped for protected variables on feature branches"
      fi

      if [ $MISSING -eq 1 ] && ([ "$CI_COMMIT_REF_NAME" = "main" ] || [ "$CI_COMMIT_REF_PROTECTED" = "true" ]); then
        echo "Please configure all required variables in GitLab CI/CD settings."
        exit 1
      fi
      echo "OK: Variable validation completed"
    - |
      echo "$(date): Validation completed" > validation-report.txt
      echo "Branch: $CI_COMMIT_REF_NAME" >> validation-report.txt
      echo "Protected: $CI_COMMIT_REF_PROTECTED" >> validation-report.txt
  artifacts:
    when: always
    paths:
      - validation-report.txt
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^staging/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"
  environment:
    name: testing
    action: start

check-dockerfile:
  stage: validate
  image: alpine:latest
  script:
    - |
      echo "Checking Dockerfile exists..."
      if [ ! -f "Dockerfile" ]; then
        echo "Error: Dockerfile not found"
        exit 1
      fi
      echo "OK: Dockerfile found"
    - |
      echo "Checking requirements.txt exists..."
      if [ ! -f "requirements.txt" ]; then
        echo "Error: requirements.txt not found"
        exit 1
      fi
      echo "OK: requirements.txt found"
    - |
      echo "Dockerfile validation completed" > dockerfile-validation.txt
      wc -l Dockerfile >> dockerfile-validation.txt
      wc -l requirements.txt >> dockerfile-validation.txt
  artifacts:
    when: always
    paths:
      - dockerfile-validation.txt
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^staging/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"

ruff-check:
  stage: lint
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir ruff
  script:
    - |
      echo "Running ruff linting..."
      # Generate GitLab Code Quality report
      ruff check . --output-format=gitlab > ruff-report.json || RUFF_EXIT=$?

      # Generate human-readable report for artifacts
      echo "=== Ruff Linting Results ===" > ruff-results.txt
      echo "Timestamp: $(date)" >> ruff-results.txt
      echo "" >> ruff-results.txt

      # Run ruff again for console output and detailed report
      ruff check . --output-format=text >> ruff-results.txt || true

      # Check if there are any issues
      if [ -s "ruff-report.json" ]; then
        echo "Ruff found issues - check the Code Quality tab in GitLab" >> ruff-results.txt
        # Still run the check for exit code
        ruff check .
      else
        echo "No ruff issues found" >> ruff-results.txt
        echo "OK: Ruff linting passed"
      fi
  artifacts:
    when: always
    paths:
      - ruff-results.txt
    reports:
      codequality: ruff-report.json
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^staging/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"

black-check:
  stage: lint
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir black
  script:
    - |
      echo "Checking code formatting with black..."
      echo "=== Black Formatting Check ===" > black-results.txt
      echo "Timestamp: $(date)" >> black-results.txt
      echo "" >> black-results.txt

      # Check formatting and capture diff
      if black --check --diff . >> black-results.txt 2>&1; then
        echo "Code is properly formatted" >> black-results.txt
        echo "OK: Code formatting is correct"
      else
        echo "" >> black-results.txt
        echo "Formatting issues found above. Run 'black .' to fix them." >> black-results.txt
        echo "Tip: Install pre-commit hooks to auto-format on commit" >> black-results.txt

        # Show the diff in job output too
        echo "Code formatting issues detected:"
        black --check --diff .
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - black-results.txt
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^staging/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"

syntax-check:
  stage: test
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - |
      echo "Running Python syntax checks..."
      echo "Syntax check results:" > syntax-report.txt
      python -m py_compile ./src/app.py
      echo "./src/app.py: OK" >> syntax-report.txt
      for file in ./src/pages/*.py; do
        python -m py_compile "$file"
        echo "$file: OK" >> syntax-report.txt
      done
      echo "OK: Python syntax checks passed"
    - |
      echo "Checking imports..."
      python -c "import streamlit; import numpy; import pandas; import matplotlib; print('OK: All imports available')" | tee -a syntax-report.txt
    - echo "Syntax check completed at $(date)" >> syntax-report.txt
  artifacts:
    when: always
    paths:
      - syntax-report.txt
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^staging/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"

unit-tests:
  stage: test
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - |
      echo "Running unit tests with pytest and coverage..."
      echo "=== Unit Test Results ===" > test-report.txt
      echo "Timestamp: $(date)" >> test-report.txt
      echo "" >> test-report.txt

      # Run pytest with coverage (Cobertura XML + HTML + Term reports)
      python -m pytest src/tests/ -v --tb=short \
        --cov=. \
        --cov-config=pyproject.toml \
        --cov-report=term-missing \
        --cov-report=xml:coverage.xml \
        --cov-report=html:htmlcov \
        --junitxml=junit.xml 2>&1 | tee pytest-output.txt

      TEST_EXIT_CODE=${PIPESTATUS[0]}
      cat pytest-output.txt >> test-report.txt

      if [ $TEST_EXIT_CODE -eq 0 ]; then
        echo "All tests passed" >> test-report.txt
        echo "OK: Unit tests completed successfully"
      else
        echo "Some tests failed" >> test-report.txt
        echo "Test failures detected - check artifacts for details"
        exit $TEST_EXIT_CODE
      fi
    - |
      echo "" >> test-report.txt
      echo "Test completed at $(date)" >> test-report.txt

      # Extract coverage percentage for display
      if [ -f "coverage.xml" ]; then
        echo "Coverage report generated successfully"
        COVERAGE_PCT=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); print(f\"{float(tree.getroot().get('line-rate', 0)) * 100:.1f}%\")" 2>/dev/null || echo "N/A")
        echo "Coverage: $COVERAGE_PCT" >> test-report.txt
      fi
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - test-report.txt
      - pytest-output.txt
      - coverage.xml
      - htmlcov/
      - junit.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit.xml
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^staging/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"

# ============================================
# SECURITY SCANNING
# ============================================

bandit-scan:
  stage: security
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir bandit
  script:
    - |
      echo "Running Bandit security scanner..."
      echo "=== Security Scan Results ===" > security-report.txt
      echo "Timestamp: $(date)" >> security-report.txt
      echo "" >> security-report.txt

      # Run Bandit and generate reports
      bandit -r . -f json -o bandit-report.json --exclude ./tests,./htmlcov,./.pytest_cache || true
      bandit -r . -f txt --exclude ./tests,./htmlcov,./.pytest_cache >> security-report.txt 2>&1 || true

      # Check for high severity issues
      HIGH_ISSUES=$(bandit -r . -f json --exclude ./tests,./htmlcov,./.pytest_cache 2>/dev/null | python -c "import sys,json; d=json.load(sys.stdin); print(len([r for r in d.get('results',[]) if r.get('issue_severity')=='HIGH']))" 2>/dev/null || echo "0")

      if [ "$HIGH_ISSUES" != "0" ]; then
        echo "WARNING: $HIGH_ISSUES high severity security issues found!" >> security-report.txt
        echo "Security scan completed with warnings"
      else
        echo "No high severity issues found" >> security-report.txt
        echo "OK: Security scan passed"
      fi
  artifacts:
    when: always
    paths:
      - security-report.txt
      - bandit-report.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^staging/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"

dependency-audit:
  stage: security
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir pip-audit
  script:
    - |
      echo "Checking for vulnerable dependencies..."
      echo "=== Dependency Vulnerability Report ===" > dependency-report.txt
      echo "Timestamp: $(date)" >> dependency-report.txt
      echo "" >> dependency-report.txt

      # Run pip-audit
      pip-audit -r requirements.txt --format json > pip-audit.json 2>&1 || true
      pip-audit -r requirements.txt >> dependency-report.txt 2>&1 || true

      # Count vulnerabilities
      VULN_COUNT=$(python -c "import json; d=json.load(open('pip-audit.json')); print(len(d.get('dependencies', [])))" 2>/dev/null || echo "0")

      if [ "$VULN_COUNT" != "0" ]; then
        echo "WARNING: Found $VULN_COUNT vulnerable dependencies" >> dependency-report.txt
      else
        echo "No known vulnerabilities found" >> dependency-report.txt
        echo "OK: Dependency audit passed"
      fi
  artifacts:
    when: always
    paths:
      - dependency-report.txt
      - pip-audit.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^staging/'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"
  environment:
    name: testing
    action: stop

compute-semver:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "compute-semver: Determine VERSION for branch $CI_COMMIT_REF_NAME"
      TOKEN=""
      if [ -n "$GITLAB_API_TOKEN" ]; then
        TOKEN="$GITLAB_API_TOKEN"
      else
        TOKEN="$CI_JOB_TOKEN"
      fi

      if [ -z "$TOKEN" ]; then
        echo "ERROR: No token available (GITLAB_API_TOKEN or CI_JOB_TOKEN)" >&2
        exit 1
      fi

      API="$CI_API_V4_URL/projects/$CI_PROJECT_ID"

      # If this is a staging branch, use the commit short SHA as version
      if echo "$CI_COMMIT_REF_NAME" | grep -Eq '^staging'; then
        echo "Staging branch detected — using commit short SHA as version"
        NEW_VERSION="$CI_COMMIT_SHORT_SHA"
        echo "$NEW_VERSION" > VERSION
        echo "APP_VERSION=$NEW_VERSION" > computed_version.env
        echo "Computed version (staging): $NEW_VERSION"
        exit 0
      fi

      # For production (main), compute semantic version based on MR/Issue labels
      echo "Fetching latest tags..."
      TAGS_JSON=$(curl --silent --header "PRIVATE-TOKEN: $TOKEN" "$API/repository/tags?per_page=100&order_by=updated&sort=desc") || true
      LATEST_TAG=$(echo "$TAGS_JSON" | jq -r 'if type=="array" then (.[0].name // empty) elif type=="object" then (.name // empty) else empty end')

      if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
        echo "No existing tags — starting at 0.0.1"
        LATEST_TAG_STRIPPED="0.0.0"
      else
        LATEST_TAG_STRIPPED=${LATEST_TAG#v}
        echo "Latest tag: $LATEST_TAG (normalized: $LATEST_TAG_STRIPPED)"
      fi

      # Determine MR(s) associated with the current commit
      echo "Looking up merge requests for commit $CI_COMMIT_SHA"
      MR_LIST_JSON=$(curl --silent --header "PRIVATE-TOKEN: $TOKEN" "$API/repository/commits/$CI_COMMIT_SHA/merge_requests" || true)
      MR_IID=$(echo "$MR_LIST_JSON" | jq -r 'if type=="array" then (.[0].iid // empty) elif type=="object" then (.iid // empty) else empty end')

      BUMP=""
      ISSUE_IID=""

      if [ -n "$MR_IID" ]; then
        echo "Found MR IID: $MR_IID — fetching details"
        MR_DETAILS=$(curl --silent --header "PRIVATE-TOKEN: $TOKEN" "$API/merge_requests/$MR_IID" || true)
        # Check MR labels first for type:: labels
        MR_TYPE_LABEL=$(echo "$MR_DETAILS" | jq -r '.labels[]? // empty' | tr '\n' ' ' | tr ' ' '\n' | grep -Ei 'type::' | head -n1 || true)
        if [ -n "$MR_TYPE_LABEL" ]; then
          echo "MR has type label: $MR_TYPE_LABEL"
        else
          # Try to find referenced issue number in MR description (e.g., Closes #123)
          DESC=$(echo "$MR_DETAILS" | jq -r '.description // empty')
          ISSUE_IID=$(echo "$DESC" | grep -oE '#[0-9]+' | head -n1 | tr -d '#') || true
          if [ -n "$ISSUE_IID" ]; then
            echo "MR references issue #$ISSUE_IID — fetching issue labels"
            ISSUE_JSON=$(curl --silent --header "PRIVATE-TOKEN: $TOKEN" "$API/issues/$ISSUE_IID" || true)
            MR_TYPE_LABEL=$(echo "$ISSUE_JSON" | jq -r '.labels[]? // empty' | tr '\n' ' ' | tr ' ' '\n' | grep -Ei 'type::' | head -n1 || true)
          fi
        fi

        # Translate label to bump
        if echo "$MR_TYPE_LABEL" | grep -Eiq 'major|type::major|type::major-change|breaking'; then
          BUMP=major
        elif echo "$MR_TYPE_LABEL" | grep -Eiq 'user[-_ ]?story|feature|type::user-story|type::feature'; then
          BUMP=minor
        elif echo "$MR_TYPE_LABEL" | grep -Eiq 'bug|bugfix|fix|type::bugfix|type::bug-fix|type::bug'; then
          BUMP=patch
        else
          BUMP=""
        fi
      else
        echo "No MR found for commit $CI_COMMIT_SHA — defaulting to patch bump"
        BUMP=patch
      fi

      if [ -z "$BUMP" ]; then
        echo "No type labels found — defaulting to patch"
        BUMP=patch
      fi

      echo "Bump decision: $BUMP"

      # Split latest semver
      IFS='.' read -r MAJOR MINOR PATCH <<EOF
      ${LATEST_TAG_STRIPPED}
      EOF

      MAJOR=${MAJOR:-0}
      MINOR=${MINOR:-0}
      PATCH=${PATCH:-0}

      case "$BUMP" in
        major)
          MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0;;
        minor)
          MINOR=$((MINOR + 1)); PATCH=0;;
        *)
          PATCH=$((PATCH + 1));;
      esac

      NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
      echo "Computed new semantic version: $NEW_VERSION (from latest ${LATEST_TAG:-none})"
      echo "$NEW_VERSION" > VERSION
      echo "APP_VERSION=$NEW_VERSION" > computed_version.env
    - |
      echo "Version written: $(cat VERSION)"
  artifacts:
    when: always
    paths:
      - VERSION
      - computed_version.env
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME =~ /^staging\/mr-.*$/
    - if: $CI_COMMIT_REF_NAME == "main"

docker-build:
  stage: build
  image: docker:latest
  needs:
    - job: compute-semver
      artifacts: true
  services:
    - docker:dind
  before_script:
    - echo "Preparing Docker build..."
    - apk add --no-cache bash curl
  script:
    - |
      if [ -f "$VERSION_FILE" ]; then
        SEMANTIC_VERSION=$(cat $VERSION_FILE)
        echo "Using semantic version from VERSION file: $SEMANTIC_VERSION"
        IMAGE_TAG="$SEMANTIC_VERSION"
      else
        IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
        echo "No VERSION file found, using commit SHA: $IMAGE_TAG"
      fi
    - |
      echo "Authenticating with Azure Container Registry..."
      echo "$AZURE_CLIENT_SECRET" | docker login "$DOCKER_REGISTRY" --username "$AZURE_CLIENT_ID" --password-stdin
    - |
      echo "Building Docker image..."
      docker build -f Dockerfile --build-arg APP_VERSION=${IMAGE_TAG} -t ${DOCKER_IMAGE_NAME}:${IMAGE_TAG} -t ${DOCKER_IMAGE_NAME}:${LATEST_TAG} .
      echo $(docker image inspect ${DOCKER_IMAGE_NAME}:${IMAGE_TAG} --format '{{range .Config.Env}}{{println .}}{{end}}' | grep APP_VERSION || true)
    - |
      echo "Tagging image for ACR..."
      docker tag ${DOCKER_IMAGE_NAME}:${IMAGE_TAG} ${DOCKER_IMAGE_URI}:${IMAGE_TAG}
      docker tag ${DOCKER_IMAGE_NAME}:${LATEST_TAG} ${DOCKER_IMAGE_URI}:${LATEST_TAG}
    - |
      echo "Pushing image to Azure Container Registry..."
      docker push ${DOCKER_IMAGE_URI}:${IMAGE_TAG}
      docker push ${DOCKER_IMAGE_URI}:${LATEST_TAG}
      echo "OK: Docker image pushed successfully"
      echo "   Version tag: ${DOCKER_IMAGE_URI}:${IMAGE_TAG}"
      echo "   Latest tag: ${DOCKER_IMAGE_URI}:${LATEST_TAG}"
      echo "echo ${IMAGE_TAG}"
      echo "${IMAGE_TAG}" > ../$VERSION_FILE
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^staging\/mr-.*$/
    - if: $CI_COMMIT_REF_NAME == "main"
  artifacts:
    when: on_success
    access: all
    paths:
      - $VERSION_FILE
    expire_in: 1 day

# ============================================
# AUTO-PUSH TO STAGING BRANCH
# ============================================
# When a merge request is created, this job automatically:
# 1. Creates a staging branch named: staging/mr-{MR_NUMBER}-{SOURCE_BRANCH_NAME}
# 2. Pushes the MR code to that staging branch
# 3. Triggers the deployment pipeline on the staging branch
# 4. Creates a unique staging environment for each MR

push-to-staging:
  stage: push:staging
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
  before_script:
    - apk add --no-cache git curl jq
    - git config --global user.email "gitlab-ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - echo "Pushing merge request code to staging branch..."
    - echo "Source branch $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - echo "Target branch $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - echo "MR IID $CI_MERGE_REQUEST_IID"
    - export STAGING_BRANCH="staging/mr-${CI_MERGE_REQUEST_IID}-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
    - echo "Staging branch $STAGING_BRANCH"
    - git fetch origin
    - git checkout -B $STAGING_BRANCH
    - git push -f origin $STAGING_BRANCH
    - echo "Successfully pushed to staging branch $STAGING_BRANCH"
    - |
      # IMMEDIATELY set commit status to PENDING on several MR-related SHAs to block merging
      echo "Setting commit status to PENDING to block MR merge..."
      TOKEN=""
      if [ -n "$GITLAB_API_TOKEN" ]; then
        TOKEN="$GITLAB_API_TOKEN"
      elif [ -n "$CI_JOB_TOKEN" ]; then
        TOKEN="$CI_JOB_TOKEN"
      fi

      if [ -z "$TOKEN" ]; then
        echo "ERROR: No token available (GITLAB_API_TOKEN or CI_JOB_TOKEN) - cannot set commit status" >&2
        exit 1
      fi

      # Fetch MR details to gather candidate SHAs
      MR_IID=${CI_MERGE_REQUEST_IID}
      MR_API="$CI_API_V4_URL/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}"
      MR_JSON=$(curl --silent --header "PRIVATE-TOKEN: $TOKEN" "$MR_API" || true)

      # Collect SHAs: CI_COMMIT_SHA, MR.sha, MR.merge_commit_sha, MR.head_sha
      SHAS="${CI_COMMIT_SHA}"
      MR_SHA=$(echo "$MR_JSON" | jq -r '.sha // empty')
      MERGE_COMMIT_SHA=$(echo "$MR_JSON" | jq -r '.merge_commit_sha // empty')
      HEAD_SHA=$(echo "$MR_JSON" | jq -r '.head_sha // empty')

      # Also try to get latest MR pipeline SHA
      MR_PIPELINE_JSON=$(curl --silent --header "PRIVATE-TOKEN: $TOKEN" "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/pipelines?per_page=1" || true)
      MR_PIPELINE_SHA=$(echo "$MR_PIPELINE_JSON" | jq -r '.[0].sha // empty')

      for s in "$MR_SHA" "$MERGE_COMMIT_SHA" "$HEAD_SHA" "$MR_PIPELINE_SHA"; do
        if [ -n "$s" ] && [ "$s" != "null" ]; then
          SHAS="$SHAS $s"
        fi
      done

      # Deduplicate SHAs
      UNIQUE_SHAS=$(echo $SHAS | tr ' ' '\n' | sort -u | tr '\n' ' ')

      for SHA in $UNIQUE_SHAS; do
        if [ -n "$SHA" ]; then
          echo "Setting pending status on $SHA"
          curl --silent --request POST \
            --header "PRIVATE-TOKEN: $TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"state":"pending","name":"staging/mr-'"${MR_IID}"'","target_url":"'"${CI_PROJECT_URL}/-/environments"'","description":"Deploy to staging environment and test before cleanup"}' \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/statuses/${SHA}" || echo "Failed to set status on $SHA"
        fi
      done
      echo "MR merge should be blocked while staging exists (pending statuses set)."
    - |
      # Protect the staging branch via GitLab API
      ENCODED_BRANCH=$(echo "$STAGING_BRANCH" | sed 's/\//%2F/g')
      if [ -n "$GITLAB_API_TOKEN" ]; then
        echo "Protecting staging branch via API..."
        curl --silent --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          --header "Content-Type: application/json" \
          --data '{
            "name": "'"$STAGING_BRANCH"'",
            "push_access_level": 40,
            "merge_access_level": 40,
            "allow_force_push": true
          }' \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/protected_branches" || echo "Branch protection may already exist"
        echo "Staging branch protected: $STAGING_BRANCH"
      else
        echo "Warning: GITLAB_API_TOKEN not set - branch will not be protected"
        echo "Create a Project Access Token with 'api' scope and add as GITLAB_API_TOKEN variable"
      fi
    - echo "Triggering pipeline on staging branch..."
    - |
      if [ -n "$CI_TRIGGER_TOKEN" ]; then
        curl --request POST \
          --form "token=${CI_TRIGGER_TOKEN}" \
          --form "ref=${STAGING_BRANCH}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"
        echo "Pipeline triggered on staging branch"
      else
        echo "Warning: CI_TRIGGER_TOKEN not set. Please add a pipeline trigger token."
        echo "Go to Settings -> CI/CD -> Pipeline trigger tokens -> Add new token"
        echo "Then add CI_TRIGGER_TOKEN variable with the token value"
      fi
    - |
      echo "Staging branch $STAGING_BRANCH" > staging-branch-info.txt
      echo "MR IID $CI_MERGE_REQUEST_IID" >> staging-branch-info.txt
      echo "Source $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" >> staging-branch-info.txt
      echo "MR_PIPELINE_SHA $CI_COMMIT_SHA" >> staging-branch-info.txt
      echo "Protected: true" >> staging-branch-info.txt
      echo "Pushed at $(date)" >> staging-branch-info.txt
  artifacts:
    when: always
    paths:
      - staging-branch-info.txt
    expire_in: 1 day

# ============================================
# STAGING ENVIRONMENT DEPLOYMENT
# ============================================

deploy-staging:
  stage: deploy:staging
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^staging\/mr-.*$/
      when: manual
  before_script:
    - |
      echo "Authenticating with Azure..."
      if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] || [ -z "$AZURE_TENANT_ID" ]; then
        echo "Error: Missing Azure credentials. Ensure variables are configured as protected."
        echo "Staging deployment requires protected branch or manual pipeline trigger."
        exit 1
      fi
      az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      # ensure jq and curl are available for GitLab API calls
      apt-get update -y && apt-get install -y jq curl || true
  script:
    - |
      IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"

      # Extract MR number from staging branch name if available (POSIX-compatible)
      MR_NUMBER=$(echo "$CI_COMMIT_REF_NAME" | sed -n 's/^staging\/mr-\([0-9]*\)-.*/\1/p')
      if [ -n "$MR_NUMBER" ]; then
        STAGING_WEBAPP_NAME="${AZURE_WEBAPP_NAME}-staging-mr${MR_NUMBER}"
      else
        STAGING_WEBAPP_NAME="${AZURE_WEBAPP_NAME}-staging-${IMAGE_TAG}"
      fi

      echo "Creating staging environment: ${STAGING_WEBAPP_NAME}"
      echo "Staging deployment started at $(date)" > staging-deployment-report.txt
      echo "Environment: STAGING" >> staging-deployment-report.txt
      echo "Image tag: $IMAGE_TAG" >> staging-deployment-report.txt
      echo "Target: ${STAGING_WEBAPP_NAME}" >> staging-deployment-report.txt
      echo "Branch: $CI_COMMIT_REF_NAME" >> staging-deployment-report.txt
    - |
      # Create or update a minimal Container App for staging
      echo "Checking if staging container app exists..."
      if ! az containerapp show --name ${STAGING_WEBAPP_NAME} --resource-group $AZURE_RESOURCE_GROUP &> /dev/null; then
        echo "Creating new staging container app: ${STAGING_WEBAPP_NAME}"
        az containerapp create \
          --name ${STAGING_WEBAPP_NAME} \
          --resource-group $AZURE_RESOURCE_GROUP \
          --environment $CONTAINERAPPS_ENV \
          --image ${DOCKER_IMAGE_URI}:${IMAGE_TAG} \
          --registry-server ${DOCKER_REGISTRY} \
          --registry-username ${AZURE_CLIENT_ID} \
          --registry-password ${AZURE_CLIENT_SECRET} \
          --ingress external \
          --target-port 8501 \
          --min-replicas 0 \
          --max-replicas 1 >> staging-deployment-report.txt 2>&1 || {
          echo "Failed to create container app" >> staging-deployment-report.txt; exit 1; }
      else
        echo "Staging container app already exists: ${STAGING_WEBAPP_NAME} — updating image"
        az containerapp update \
          --name ${STAGING_WEBAPP_NAME} \
          --resource-group $AZURE_RESOURCE_GROUP \
          --set template.containers[0].image="${DOCKER_IMAGE_URI}:${IMAGE_TAG}" >> staging-deployment-report.txt 2>&1 || true
        # Restart/revision to pick up the new image
        az containerapp revision restart --name ${STAGING_WEBAPP_NAME} --resource-group $AZURE_RESOURCE_GROUP >> staging-deployment-report.txt 2>&1 || true
      fi
    - |
      # Retrieve the FQDN for the container app and wait for it to be available
      STAGING_FQDN=$(az containerapp show --name ${STAGING_WEBAPP_NAME} --resource-group ${AZURE_RESOURCE_GROUP} --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || echo "")
      if [ -z "$STAGING_FQDN" ]; then
        echo "Could not determine container app FQDN; failing" >> staging-deployment-report.txt
        exit 1
      fi
      echo "Container App FQDN: $STAGING_FQDN" >> staging-deployment-report.txt
      # Update GitLab Environment external_url to the exact Container Apps FQDN
      if [ -n "$GITLAB_API_TOKEN" ] || [ -n "$CI_JOB_TOKEN" ]; then
        echo "Setting GitLab Environment URL to https://$STAGING_FQDN"
        if [ -n "$GITLAB_API_TOKEN" ]; then
          AUTH_HEADER="PRIVATE-TOKEN: $GITLAB_API_TOKEN"
        else
          AUTH_HEADER="JOB-TOKEN: $CI_JOB_TOKEN"
        fi
        ENV_NAME="staging"
        # Try to find existing environment by name
        EXISTING_ENV=$(curl --silent --header "$AUTH_HEADER" "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/environments?search=${ENV_NAME}" || true)
        ENV_ID=$(echo "$EXISTING_ENV" | jq -r 'if type=="array" and .[0] then .[0].id else empty end')
        if [ -n "$ENV_ID" ]; then
          curl --silent --request PUT --header "$AUTH_HEADER" --header "Content-Type: application/json" --data '{"external_url":"https://'"$STAGING_FQDN"'"}' "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/environments/${ENV_ID}" || true
        else
          curl --silent --request POST --header "$AUTH_HEADER" --header "Content-Type: application/json" --data '{"name":"'"$ENV_NAME"'","external_url":"'"https://$STAGING_FQDN"'"}' "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/environments" || true
        fi
      else
        echo "No GitLab token available; skipping environment URL update" >> staging-deployment-report.txt
      fi
      echo "Waiting 30s for container app to warm up..." >> staging-deployment-report.txt
      sleep 30
    - |
      # Health check for staging environment (use the Container Apps FQDN)
      echo "Performing health checks on staging environment https://${STAGING_FQDN} ..."
      HEALTH_PASSED=false
      for i in {1..30}; do
        response_code=$(curl -s -o /dev/null -w "%{http_code}" "https://${STAGING_FQDN}" || echo "000")
        if [ "$response_code" = "200" ]; then
          echo "Staging environment comprehensive health check passed (attempt $i)" >> staging-deployment-report.txt
          echo "Response code: $response_code" >> staging-deployment-report.txt
          HEALTH_PASSED=true
          break
        fi
        echo "Health check attempt $i failed (HTTP $response_code), retrying in 10s..." >> staging-deployment-report.txt
        sleep 10
      done

      if [ "$HEALTH_PASSED" = "false" ]; then
        echo "Staging environment health check failed after 5 minutes" >> staging-deployment-report.txt
        exit 1
      fi
    - |
      echo "Staging deployment completed successfully!"
      echo "Staging URL: https://${STAGING_FQDN}"
      echo ""
      echo "============================================"
      echo "TESTING INSTRUCTIONS:"
      echo "============================================"
      echo "1. Test the application at: https://${STAGING_FQDN}"
      echo "2. Verify all functionality works as expected"
      echo "3. When testing is complete, run 'stop-staging' job to:"
      echo "   - Delete the staging environment"
      echo "   - Unblock the MR for merging"
      echo "   - Clean up the staging branch"
      echo "============================================"
      echo ""
      echo "Staging deployment completed at $(date)" >> staging-deployment-report.txt
      echo "Status: SUCCESS - Ready for testing" >> staging-deployment-report.txt
  artifacts:
    when: always
    paths:
      - staging-deployment-report.txt
    expire_in: 1 month
  environment:
    name: staging
    url: https://${STAGING_WEBAPP_NAME}.${APP_LOCATION}.azurecontainerapps.io
    on_stop: stop-staging
    deployment_tier: staging
    auto_stop_in: 3 days

stop-staging:
  stage: deploy:staging
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^staging\/mr-.*$/
      when: manual

  before_script:
    - |
      echo "Authenticating with Azure..."
      az login --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --password "$AZURE_CLIENT_SECRET" \
        --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"

    - apt-get update && apt-get install -y curl jq

  script:
    - |
      set -euo pipefail

      echo "Stopping staging environment and unblocking MR merge…"

      MR_NUMBER=$(echo "$CI_COMMIT_REF_NAME" | sed -n 's/^staging\/mr-\([0-9]\+\)-.*/\1/p')
      SOURCE_BRANCH=$(echo "$CI_COMMIT_REF_NAME" | sed -n 's/^staging\/mr-[0-9]\+-\(.*\)$/\1/p')

      if [ -z "$SOURCE_BRANCH" ]; then
        echo "Could not determine source branch from $CI_COMMIT_REF_NAME"
        exit 0
      fi

      echo "Source branch: $SOURCE_BRANCH"
      echo "MR number (from branch): $MR_NUMBER"

      STAGING_WEBAPP_NAME="${AZURE_WEBAPP_NAME}-staging-mr${MR_NUMBER}"

      echo "Deleting Azure Container App: $STAGING_WEBAPP_NAME"
      # Use portable redirection and non-interactive delete. Wait briefly for deletion to complete.
      if az containerapp show --name "$STAGING_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
        echo "Found Container App — deleting ${STAGING_WEBAPP_NAME}..."
        # Delete without interactive prompt
        az containerapp delete --name "$STAGING_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --yes || {
          echo "Warning: az containerapp delete returned non-zero" >&2
        }
      else
        echo "Staging Container App already gone"
      fi

      MR_JSON=$(curl --silent --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests?source_branch=${SOURCE_BRANCH}&state=opened")

      MR_IID=$(echo "$MR_JSON" | jq -r '.[0].iid // empty')

      if [ -z "$MR_IID" ]; then
        echo "No open MR found for branch $SOURCE_BRANCH"
        exit 1
      fi

      echo "Found MR IID: $MR_IID"

      # Try the reliable flow: use the MR's head_pipeline.sha to find running pipelines
      MR_DETAIL=$(curl --silent --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}" || true)
      PIPELINE_SHA=$(echo "$MR_DETAIL" | jq -r '.head_pipeline.sha // empty')
      PIPELINE_ID=$(echo "$MR_DETAIL" | jq -r '.head_pipeline.id // empty')

      if [ -z "$PIPELINE_SHA" ]; then
        echo "No pipeline SHA found for MR $MR_IID"
        exit 1
      fi

      echo "Using MR pipeline SHA: $PIPELINE_SHA"

      echo "Setting commit status to SUCCESS"

      curl --silent --request POST \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --header "Content-Type: application/json" \
        --data '{
          "state": "success",
          "name": "staging/mr-'"${MR_NUMBER}"'",
          "target_url": "'"${CI_PIPELINE_URL}"'",
          "description": "Staging environment stopped — ready to merge"
        }' \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/statuses/${PIPELINE_SHA}?pipeline_id=${PIPELINE_ID}"

      echo "SUCCESS: MR is now unblocked for merge"

  environment:
    name: staging
    action: stop


# Staging cleanup - Unprotects and deletes staging branch
# Requires GITLAB_API_TOKEN: Project Access Token with 'api' scope
cleanup-staging:
  stage: deploy:staging
  image: alpine:latest
  needs:
    - job: stop-staging
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^staging\/mr-.*$/
      when: on_success
  before_script:
    - |
      apk add --no-cache git curl
      git config --global user.email "gitlab-ci@gitlab.com"
      git config --global user.name "GitLab CI"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      echo "========================================"
      echo "STAGING CLEANUP - Branch Teardown"
      echo "========================================"
      echo "Branch: $CI_COMMIT_REF_NAME"
      echo "Cleanup started at $(date)" > cleanup-report.txt
    - |
      # Step 1: Unprotect the staging branch
      echo "Step 1: Unprotecting staging branch..."
      ENCODED_BRANCH=$(echo "$CI_COMMIT_REF_NAME" | sed 's/\//%2F/g')

      if [ -n "$GITLAB_API_TOKEN" ]; then
        echo "Removing branch protection via API..."
        UNPROTECT_RESPONSE=$(curl --silent --write-out "\nHTTP_CODE:%{http_code}" --request DELETE \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/protected_branches/${ENCODED_BRANCH}")
        HTTP_CODE=$(echo "$UNPROTECT_RESPONSE" | grep "HTTP_CODE" | cut -d':' -f2)

        if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "404" ]; then
          echo "Branch protection removed" >> cleanup-report.txt
          echo "SUCCESS: Branch protection removed"
        else
          echo "Warning: Could not remove protection (HTTP $HTTP_CODE)" >> cleanup-report.txt
        fi
      else
        echo "WARNING: GITLAB_API_TOKEN not set - cannot unprotect branch" >> cleanup-report.txt
        echo "WARNING: GITLAB_API_TOKEN not set"
      fi
    - |
      # Step 2: Delete the staging branch
      echo "Step 2: Deleting staging branch..."
      if [ -n "$GITLAB_API_TOKEN" ]; then
        echo "Deleting branch via API..."
        DELETE_RESPONSE=$(curl --silent --write-out "\nHTTP_CODE:%{http_code}" --request DELETE \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches/${ENCODED_BRANCH}")
        HTTP_CODE=$(echo "$DELETE_RESPONSE" | grep "HTTP_CODE" | cut -d':' -f2)

        if [ "$HTTP_CODE" = "204" ]; then
          echo "Branch deleted: $CI_COMMIT_REF_NAME" >> cleanup-report.txt
          echo "SUCCESS: Staging branch deleted"
        else
          echo "Warning: Could not delete branch via API (HTTP $HTTP_CODE)" >> cleanup-report.txt
          echo "Trying git push --delete..."
          git push origin --delete "$CI_COMMIT_REF_NAME" 2>&1 && echo "Branch deleted via git" >> cleanup-report.txt || echo "Could not delete branch" >> cleanup-report.txt
        fi
      else
        echo "Trying to delete branch via git..."
        git push origin --delete "$CI_COMMIT_REF_NAME" 2>&1 && echo "Branch deleted via git" >> cleanup-report.txt || echo "Could not delete branch - manual deletion required" >> cleanup-report.txt
      fi
    - |
      echo "========================================"
      echo "CLEANUP COMPLETE"
      echo "========================================"
      echo "Cleanup completed at $(date)" >> cleanup-report.txt
      cat cleanup-report.txt
      # Note: Commit status is set in stop-staging job to unblock MR immediately
  artifacts:
    when: always
    paths:
      - cleanup-report.txt
    expire_in: 1 week
  allow_failure: true

# ============================================
# PRODUCTION ENVIRONMENT DEPLOYMENT
# ============================================

deploy-production:
  stage: deploy:production
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: manual
  before_script:
    - |
      echo "Authenticating with Azure..."
      if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] || [ -z "$AZURE_TENANT_ID" ]; then
        echo "Error: Missing Azure credentials. Ensure variables are configured as protected."
        echo "Production deployment requires main branch or protected branch."
        exit 1
      fi
      az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      # ensure jq and curl are available for GitLab API calls
      apt-get update -y && apt-get install -y jq curl || true
  script:
    - |
      if [ -f "$VERSION_FILE" ]; then
        SEMANTIC_VERSION=$(cat $VERSION_FILE)
        IMAGE_TAG="$SEMANTIC_VERSION"
      else
        IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "=== PRODUCTION DEPLOYMENT ==="
      echo "Production deployment started at $(date)" > production-deployment-report.txt
      echo "Environment: PRODUCTION" >> production-deployment-report.txt
      echo "Image tag: $IMAGE_TAG" >> production-deployment-report.txt
      echo "Target: ${PRODUCTION_WEBAPP_NAME}" >> production-deployment-report.txt
      echo "Pipeline ID: $CI_PIPELINE_ID" >> production-deployment-report.txt
      echo "Commit SHA: $CI_COMMIT_SHA" >> production-deployment-report.txt
    - |
      # Store deployment metadata for rollback
      echo "$IMAGE_TAG" > current-production-version.txt
      echo "$CI_PIPELINE_ID" > current-production-pipeline.txt
      echo "$(date -Iseconds)" > production-deployment-timestamp.txt
      echo "Preparing to deploy Container App: ${PRODUCTION_WEBAPP_NAME}" >> production-deployment-report.txt
    - |
      # Create or update a minimal Container App for production
      echo "Creating or updating production Container App: ${PRODUCTION_WEBAPP_NAME}"
      if ! az containerapp show --name ${PRODUCTION_WEBAPP_NAME} --resource-group ${AZURE_RESOURCE_GROUP} &> /dev/null; then
        echo "Creating Container App: ${PRODUCTION_WEBAPP_NAME}" >> production-deployment-report.txt
        az containerapp create \
          --name ${PRODUCTION_WEBAPP_NAME} \
          --resource-group $AZURE_RESOURCE_GROUP \
          --environment $CONTAINERAPPS_ENV \
          --image ${DOCKER_IMAGE_URI}:${IMAGE_TAG} \
          --registry-server ${DOCKER_REGISTRY} \
          --registry-username ${AZURE_CLIENT_ID} \
          --registry-password ${AZURE_CLIENT_SECRET} \
          --ingress external \
          --target-port 8501 \
          --min-replicas 0 \
          --max-replicas ${PRODUCTION_MAX_REPLICAS:-3} >> production-deployment-report.txt 2>&1 || { echo "Container App creation failed" >> production-deployment-report.txt; exit 1; }
      else
        echo "Container App exists; updating image and scaling settings" >> production-deployment-report.txt
        az containerapp update \
          --name ${PRODUCTION_WEBAPP_NAME} \
          --resource-group $AZURE_RESOURCE_GROUP \
          --set template.containers[0].image="${DOCKER_IMAGE_URI}:${IMAGE_TAG}" \
                 template.scale.minReplicas=${PRODUCTION_MIN_REPLICAS:-0} \
                 template.scale.maxReplicas=${PRODUCTION_MAX_REPLICAS:-3} >> production-deployment-report.txt 2>&1 || true
        az containerapp revision restart --name ${PRODUCTION_WEBAPP_NAME} --resource-group $AZURE_RESOURCE_GROUP >> production-deployment-report.txt 2>&1 || true
      fi
    - |
      # Retrieve the FQDN for the container app and wait for it to be available
      PROD_FQDN=$(az containerapp show --name ${PRODUCTION_WEBAPP_NAME} --resource-group ${AZURE_RESOURCE_GROUP} --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || echo "")
      if [ -z "$PROD_FQDN" ]; then
        echo "Could not determine production Container App FQDN; failing" >> production-deployment-report.txt
        exit 1
      fi
      echo "Production Container App FQDN: $PROD_FQDN" >> production-deployment-report.txt
      echo "Waiting 30s for production container app to warm up..." >> production-deployment-report.txt
      sleep 30
      # Update GitLab Environment external_url to the exact Container Apps FQDN
      if [ -n "$GITLAB_API_TOKEN" ] || [ -n "$CI_JOB_TOKEN" ]; then
        echo "Setting GitLab Environment URL to https://$PROD_FQDN"
        if [ -n "$GITLAB_API_TOKEN" ]; then
          AUTH_HEADER="PRIVATE-TOKEN: $GITLAB_API_TOKEN"
        else
          AUTH_HEADER="JOB-TOKEN: $CI_JOB_TOKEN"
        fi
        ENV_NAME="production"
        EXISTING_ENV=$(curl --silent --header "$AUTH_HEADER" "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/environments?search=${ENV_NAME}" || true)
        ENV_ID=$(echo "$EXISTING_ENV" | jq -r 'if type=="array" and .[0] then .[0].id else empty end')
        if [ -n "$ENV_ID" ]; then
          curl --silent --request PUT --header "$AUTH_HEADER" --header "Content-Type: application/json" --data '{"external_url":"'"https://$PROD_FQDN"'"}' "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/environments/${ENV_ID}" || true
        else
          curl --silent --request POST --header "$AUTH_HEADER" --header "Content-Type: application/json" --data '{"name":"'"$ENV_NAME"'","external_url":"'"https://$PROD_FQDN"'"}' "$CI_API_V4_URL/projects/${CI_PROJECT_ID}/environments" || true
        fi
      else
        echo "No GitLab token available; skipping environment URL update" >> production-deployment-report.txt
      fi
    - |
      # Production health checks against Container App FQDN
      echo "Performing CRITICAL production health checks against https://$PROD_FQDN"
      HEALTH_PASSED=false
      for i in {1..60}; do
        response_code=$(curl -s -o /dev/null -w "%{http_code}" "https://$PROD_FQDN" || echo "000")
        if [ "$response_code" = "200" ]; then
          echo "Production health check PASSED (attempt $i)" >> production-deployment-report.txt
          HEALTH_PASSED=true
          break
        fi
        echo "Health check attempt $i failed (HTTP $response_code), retrying in 10s..." >> production-deployment-report.txt
        sleep 10
      done

      if [ "$HEALTH_PASSED" = "false" ]; then
        echo "CRITICAL: Production health check FAILED after timeout" >> production-deployment-report.txt
        exit 1
      fi
    - |
      # Success notifications
      echo "PRODUCTION DEPLOYMENT SUCCESSFUL!"
      echo ""
      echo "============================================"
      echo "PRODUCTION DEPLOYMENT COMPLETE"
      echo "============================================"
      echo "Production URL: https://${PROD_FQDN}"
      echo "Deployed version: $IMAGE_TAG"
      echo "Pipeline ID: $CI_PIPELINE_ID"
      echo ""
      echo "Please verify the production application is working correctly."
      echo "============================================"
      echo ""

      echo "Production deployment COMPLETED SUCCESSFULLY!" >> production-deployment-report.txt
      echo "Production URL: https://${PROD_FQDN}" >> production-deployment-report.txt
      echo "Production deployment completed at $(date)" >> production-deployment-report.txt
      echo "Status: SUCCESS" >> production-deployment-report.txt
      echo "Health check: PASSED" >> production-deployment-report.txt
  artifacts:
    when: always
    paths:
      - production-deployment-report.txt
      - current-production-version.txt
      - current-production-pipeline.txt
      - production-deployment-timestamp.txt
      - previous-production-version.txt
    expire_in: 6 months
  environment:
    name: production
    url: https://${PRODUCTION_WEBAPP_NAME}.${APP_LOCATION}.azurecontainerapps.io
    on_stop: stop-production
    deployment_tier: production

  allow_failure: false

stop-production:
  stage: deploy:production
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: manual
  allow_failure: true
  before_script:
    - |
      echo "Authenticating with Azure..."
      az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
  script:
    - |
      echo "STOPPING PRODUCTION ENVIRONMENT"
      echo "Production stop initiated at $(date)" > production-stop-report.txt
      echo "Pipeline ID: $CI_PIPELINE_ID" >> production-stop-report.txt

      az containerapp stop --name ${PRODUCTION_WEBAPP_NAME} --resource-group ${AZURE_RESOURCE_GROUP} >> production-stop-report.txt 2>&1
      echo "Production environment stopped at $(date)" >> production-stop-report.txt
  artifacts:
    when: always
    paths:
      - production-stop-report.txt
    expire_in: 6 months
  when: manual
  environment:
    name: production
    action: stop

# ============================================
# POST-DEPLOYMENT VERIFICATION
# ============================================

# Smoke testing disabled - tests run locally only
# smoke:testing job removed since testing deployment is disabled

# ============================================
# RELEASE MANAGEMENT
# ============================================

create-version-tag:
  stage: release
  image: alpine:latest
  needs:
    - job: deploy-production
      artifacts: true
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -f "$VERSION_FILE" ]; then
        VERSION=$(cat $VERSION_FILE)
        echo "Current version: $VERSION"
      else
        echo "Error: VERSION file not found"
        echo "Create a VERSION file with semantic version (e.g., 1.0.0)"
        exit 1
      fi
      # Choose token for pushing tags. Prefer project token with 'api' scope.
      if [ -n "$GITLAB_API_TOKEN" ]; then
        PUSH_REMOTE="https://oauth2:${GITLAB_API_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      elif [ -n "$CI_JOB_TOKEN" ]; then
        PUSH_REMOTE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      else
        echo "ERROR: No token available to push git tags. Set GITLAB_API_TOKEN or rely on CI_JOB_TOKEN." >&2
        exit 1
      fi

      git config --global user.email "gitlab-ci@${CI_SERVER_HOST}" || true
      git config --global user.name "GitLab CI" || true
      git remote set-url origin "$PUSH_REMOTE"
      git fetch --all --tags || true

      TAGNAME="v${VERSION}"
      if git rev-parse "refs/tags/${TAGNAME}" >/dev/null 2>&1; then
        echo "Tag ${TAGNAME} already exists. Skipping creation."
      else
        echo "Creating annotated tag ${TAGNAME} for commit ${CI_COMMIT_SHA}"
        git tag -a "$TAGNAME" -m "Release ${TAGNAME}" "$CI_COMMIT_SHA"
        echo "Pushing tag ${TAGNAME} to origin..."
        if git push origin "$TAGNAME" --follow-tags; then
          echo "Tag pushed: ${TAGNAME}"
        else
          echo "ERROR: Failed to push tag ${TAGNAME}" >&2
          exit 1
        fi
      fi
  artifacts:
    paths:
      - $VERSION_FILE
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
