# GitLab Auto DevOps with Azure Integration
# This is an alternative to the manual .gitlab-ci.yml
# To use this, rename it to .gitlab-ci.yml or enable Auto DevOps in GitLab settings

include:
  - template: Auto-DevOps.gitlab-ci.yml

variables:
  # Azure Configuration
  AZURE_TENANT_ID: "$AZURE_TENANT_ID"
  AZURE_SUBSCRIPTION_ID: "$AZURE_SUBSCRIPTION_ID"
  AZURE_CLIENT_ID: "$AZURE_CLIENT_ID"
  AZURE_CLIENT_SECRET: "$AZURE_CLIENT_SECRET"
  ACR_NAME: "$ACR_NAME"
  
  # Container Registry (Azure ACR)
  CI_REGISTRY: "$ACR_NAME.azurecr.io"
  CI_REGISTRY_USER: "$AZURE_CLIENT_ID"
  CI_REGISTRY_PASSWORD: "$AZURE_CLIENT_SECRET"
  CI_REGISTRY_IMAGE: "$ACR_NAME.azurecr.io/ml-visualizer"
  
  # Auto DevOps Configuration
  AUTO_DEVOPS_PLATFORM_TARGET: "ECS"  # Generic container platform
  STAGING_ENABLED: "true"
  INCREMENTAL_ROLLOUT_MODE: "manual"
  
  # Resource names per environment
  TESTING_RESOURCE_GROUP: "rg-mlvisualizer-testing"
  TESTING_APP_NAME: "app-mlvisualizer-testing"
  STAGING_RESOURCE_GROUP: "rg-mlvisualizer-staging"
  STAGING_APP_NAME: "app-mlvisualizer-staging"
  PRODUCTION_RESOURCE_GROUP: "rg-mlvisualizer-production"
  PRODUCTION_APP_NAME: "app-mlvisualizer-production"
  
  # Disable features not needed for Azure
  CODE_QUALITY_DISABLED: "false"
  LICENSE_MANAGEMENT_DISABLED: "true"
  SAST_DISABLED: "false"
  SECRET_DETECTION_DISABLED: "false"
  CONTAINER_SCANNING_DISABLED: "false"
  DAST_DISABLED: "true"  # Dynamic testing not needed initially
  PERFORMANCE_DISABLED: "true"

# Override Auto DevOps build to use Azure ACR
build:
  extends: .auto-deploy
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache curl
    - docker info
    - echo $AZURE_CLIENT_SECRET | docker login $ACR_NAME.azurecr.io -u $AZURE_CLIENT_ID --password-stdin
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -f Dockerfile .
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - docker tag $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    - docker push $CI_REGISTRY_IMAGE:latest

# Custom Azure deployment for testing
.deploy_azure_template:
  image: mcr.microsoft.com/azure-cli:latest
  before_script:
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az account set --subscription $AZURE_SUBSCRIPTION_ID
  script:
    - |
      az webapp config container set \
        --name $AZURE_APP_NAME \
        --resource-group $AZURE_RESOURCE_GROUP \
        --docker-custom-image-name $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA \
        --docker-registry-server-url https://$ACR_NAME.azurecr.io
    - az webapp restart --name $AZURE_APP_NAME --resource-group $AZURE_RESOURCE_GROUP
    - sleep 30
    - |
      for i in {1..10}; do
        if curl -f https://$AZURE_APP_NAME.azurewebsites.net/_stcore/health; then
          echo "Deployment successful!"
          exit 0
        fi
        sleep 10
      done
      exit 1

# Override testing deployment
review:
  extends: .deploy_azure_template
  stage: review
  environment:
    name: testing
    url: https://$TESTING_APP_NAME.azurewebsites.net
    on_stop: stop_review
  variables:
    AZURE_RESOURCE_GROUP: "$TESTING_RESOURCE_GROUP"
    AZURE_APP_NAME: "$TESTING_APP_NAME"
  when: manual

stop_review:
  extends: .deploy_azure_template
  stage: cleanup
  environment:
    name: testing
    action: stop
  variables:
    AZURE_RESOURCE_GROUP: "$TESTING_RESOURCE_GROUP"
    AZURE_APP_NAME: "$TESTING_APP_NAME"
  script:
    - az webapp stop --name $AZURE_APP_NAME --resource-group $AZURE_RESOURCE_GROUP
  when: manual

# Override staging deployment
staging:
  extends: .deploy_azure_template
  stage: staging
  environment:
    name: staging
    url: https://$STAGING_APP_NAME.azurewebsites.net
  variables:
    AZURE_RESOURCE_GROUP: "$STAGING_RESOURCE_GROUP"
    AZURE_APP_NAME: "$STAGING_APP_NAME"
  when: manual

# Override production deployment
production:
  extends: .deploy_azure_template
  stage: production
  environment:
    name: production
    url: https://$PRODUCTION_APP_NAME.azurewebsites.net
  variables:
    AZURE_RESOURCE_GROUP: "$PRODUCTION_RESOURCE_GROUP"
    AZURE_APP_NAME: "$PRODUCTION_APP_NAME"
  before_script:
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az account set --subscription $AZURE_SUBSCRIPTION_ID
    # Create backup slot
    - |
      az webapp deployment slot create \
        --name $PRODUCTION_APP_NAME \
        --resource-group $PRODUCTION_RESOURCE_GROUP \
        --slot backup-$(date +%Y%m%d-%H%M%S) \
        --configuration-source $PRODUCTION_APP_NAME || true
  when: manual
  only:
    - main
