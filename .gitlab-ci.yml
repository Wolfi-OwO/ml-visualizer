stages:
  - validate
  - lint
  - test
  - security
  - build
  - push:staging
  - deploy:staging
  - deploy:production
  - release

image: mcr.microsoft.com/azure-cli:latest

variables:
  DOCKER_IMAGE_NAME: "ml-visualizer"
  DOCKER_REGISTRY: "${ACR_NAME}.azurecr.io"
  DOCKER_IMAGE_URI: "${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}"
  VERSION: "${CI_COMMIT_SHORT_SHA}"
  LATEST_TAG: "latest"
  APP_DIR: "."
  VERSION_FILE: "VERSION"

  # Environment Configuration
  STAGING_WEBAPP_NAME: "${AZURE_WEBAPP_NAME}-staging-${VERSION}"
  PRODUCTION_WEBAPP_NAME: "${AZURE_WEBAPP_NAME}"

  # Health Check Configuration
  HEALTH_CHECK_TIMEOUT: "300"
  HEALTH_CHECK_INTERVAL: "10"

  # Deployment Configuration
  DEPLOYMENT_TIMEOUT: "600"
  ROLLBACK_TIMEOUT: "300"

check-variables:
  stage: validate
  image: alpine:latest
  script:
    - |
      echo "Checking required GitLab CI/CD variables..."
      echo "Note: Some variables may be protected and only available on protected branches"
      MISSING=0

      # Check if ACR_NAME is available (should be non-protected)
      if [ -z "$ACR_NAME" ]; then
        echo "Warning: ACR_NAME variable not set"
        MISSING=1
      else
        echo "ACR_NAME is configured"
      fi

      # For protected variables, we can only check on main/protected branches
      if [ "$CI_COMMIT_REF_NAME" = "main" ] || [ "$CI_COMMIT_REF_PROTECTED" = "true" ]; then
        echo "Running on protected branch: $CI_COMMIT_REF_NAME"
        for var in AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_APP_SERVICE_PLAN AZURE_WEBAPP_NAME AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do
          eval val=\$$var
          if [ -z "$val" ]; then
            echo "Error: Missing protected variable $var"
            MISSING=1
          else
            echo "$var is configured"
          fi
        done
      else
        echo "Running on non-protected branch: $CI_COMMIT_REF_NAME"
        echo "Protected variables will only be available on main branch or protected branches"
        echo "Validation will be skipped for protected variables on feature branches"
      fi

      if [ $MISSING -eq 1 ] && ([ "$CI_COMMIT_REF_NAME" = "main" ] || [ "$CI_COMMIT_REF_PROTECTED" = "true" ]); then
        echo "Please configure all required variables in GitLab CI/CD settings."
        exit 1
      fi
      echo "OK: Variable validation completed"
    - |
      echo "$(date): Validation completed" > validation-report.txt
      echo "Branch: $CI_COMMIT_REF_NAME" >> validation-report.txt
      echo "Protected: $CI_COMMIT_REF_PROTECTED" >> validation-report.txt
  artifacts:
    when: always
    paths:
      - validation-report.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != "main"
    - if: $CI_COMMIT_REF_NAME == "main"
  environment:
    name: testing
    action: start

check-dockerfile:
  stage: validate
  image: alpine:latest
  script:
    - |
      echo "Checking Dockerfile exists..."
      if [ ! -f "Dockerfile" ]; then
        echo "Error: Dockerfile not found"
        exit 1
      fi
      echo "OK: Dockerfile found"
    - |
      echo "Checking requirements.txt exists..."
      if [ ! -f "requirements.txt" ]; then
        echo "Error: requirements.txt not found"
        exit 1
      fi
      echo "OK: requirements.txt found"
    - |
      echo "Dockerfile validation completed" > dockerfile-validation.txt
      wc -l Dockerfile >> dockerfile-validation.txt
      wc -l requirements.txt >> dockerfile-validation.txt
  artifacts:
    when: always
    paths:
      - dockerfile-validation.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != "main"
    - if: $CI_COMMIT_REF_NAME == "main"

ruff-check:
  stage: lint
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir ruff
  script:
    - |
      echo "Running ruff linting..."
      # Generate GitLab Code Quality report
      ruff check . --output-format=gitlab > ruff-report.json || RUFF_EXIT=$?

      # Generate human-readable report for artifacts
      echo "=== Ruff Linting Results ===" > ruff-results.txt
      echo "Timestamp: $(date)" >> ruff-results.txt
      echo "" >> ruff-results.txt

      # Run ruff again for console output and detailed report
      ruff check . --output-format=text >> ruff-results.txt || true

      # Check if there are any issues
      if [ -s "ruff-report.json" ]; then
        echo "Ruff found issues - check the Code Quality tab in GitLab" >> ruff-results.txt
        # Still run the check for exit code
        ruff check .
      else
        echo "No ruff issues found" >> ruff-results.txt
        echo "OK: Ruff linting passed"
      fi
  artifacts:
    when: always
    paths:
      - ruff-results.txt
    reports:
      codequality: ruff-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != "main"
    - if: $CI_COMMIT_REF_NAME == "main"

black-check:
  stage: lint
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir black
  script:
    - |
      echo "Checking code formatting with black..."
      echo "=== Black Formatting Check ===" > black-results.txt
      echo "Timestamp: $(date)" >> black-results.txt
      echo "" >> black-results.txt

      # Check formatting and capture diff
      if black --check --diff . >> black-results.txt 2>&1; then
        echo "Code is properly formatted" >> black-results.txt
        echo "OK: Code formatting is correct"
      else
        echo "" >> black-results.txt
        echo "Formatting issues found above. Run 'black .' to fix them." >> black-results.txt
        echo "Tip: Install pre-commit hooks to auto-format on commit" >> black-results.txt

        # Show the diff in job output too
        echo "Code formatting issues detected:"
        black --check --diff .
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - black-results.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != "main"
    - if: $CI_COMMIT_REF_NAME == "main"

syntax-check:
  stage: test
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - |
      echo "Running Python syntax checks..."
      echo "Syntax check results:" > syntax-report.txt
      python -m py_compile app.py
      echo "app.py: OK" >> syntax-report.txt
      for file in pages/*.py; do
        python -m py_compile "$file"
        echo "$file: OK" >> syntax-report.txt
      done
      echo "OK: Python syntax checks passed"
    - |
      echo "Checking imports..."
      python -c "import streamlit; import numpy; import pandas; import matplotlib; print('OK: All imports available')" | tee -a syntax-report.txt
    - echo "Syntax check completed at $(date)" >> syntax-report.txt
  artifacts:
    when: always
    paths:
      - syntax-report.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != "main"
    - if: $CI_COMMIT_REF_NAME == "main"

unit-tests:
  stage: test
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - |
      echo "Running unit tests with pytest and coverage..."
      echo "=== Unit Test Results ===" > test-report.txt
      echo "Timestamp: $(date)" >> test-report.txt
      echo "" >> test-report.txt

      # Run pytest with coverage (Cobertura XML + HTML + Term reports)
      python -m pytest tests/ -v --tb=short \
        --cov=. \
        --cov-config=pyproject.toml \
        --cov-report=term-missing \
        --cov-report=xml:coverage.xml \
        --cov-report=html:htmlcov \
        --junitxml=junit.xml 2>&1 | tee pytest-output.txt

      TEST_EXIT_CODE=${PIPESTATUS[0]}
      cat pytest-output.txt >> test-report.txt

      if [ $TEST_EXIT_CODE -eq 0 ]; then
        echo "All tests passed" >> test-report.txt
        echo "OK: Unit tests completed successfully"
      else
        echo "Some tests failed" >> test-report.txt
        echo "Test failures detected - check artifacts for details"
        exit $TEST_EXIT_CODE
      fi
    - |
      echo "" >> test-report.txt
      echo "Test completed at $(date)" >> test-report.txt

      # Extract coverage percentage for display
      if [ -f "coverage.xml" ]; then
        echo "Coverage report generated successfully"
        COVERAGE_PCT=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); print(f\"{float(tree.getroot().get('line-rate', 0)) * 100:.1f}%\")" 2>/dev/null || echo "N/A")
        echo "Coverage: $COVERAGE_PCT" >> test-report.txt
      fi
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - test-report.txt
      - pytest-output.txt
      - coverage.xml
      - htmlcov/
      - junit.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != "main"
    - if: $CI_COMMIT_REF_NAME == "main"

# ============================================
# SECURITY SCANNING
# ============================================

bandit-scan:
  stage: security
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir bandit
  script:
    - |
      echo "Running Bandit security scanner..."
      echo "=== Security Scan Results ===" > security-report.txt
      echo "Timestamp: $(date)" >> security-report.txt
      echo "" >> security-report.txt

      # Run Bandit and generate reports
      bandit -r . -f json -o bandit-report.json --exclude ./tests,./htmlcov,./.pytest_cache || true
      bandit -r . -f txt --exclude ./tests,./htmlcov,./.pytest_cache >> security-report.txt 2>&1 || true

      # Check for high severity issues
      HIGH_ISSUES=$(bandit -r . -f json --exclude ./tests,./htmlcov,./.pytest_cache 2>/dev/null | python -c "import sys,json; d=json.load(sys.stdin); print(len([r for r in d.get('results',[]) if r.get('issue_severity')=='HIGH']))" 2>/dev/null || echo "0")

      if [ "$HIGH_ISSUES" != "0" ]; then
        echo "WARNING: $HIGH_ISSUES high severity security issues found!" >> security-report.txt
        echo "Security scan completed with warnings"
      else
        echo "No high severity issues found" >> security-report.txt
        echo "OK: Security scan passed"
      fi
  artifacts:
    when: always
    paths:
      - security-report.txt
      - bandit-report.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != "main"
    - if: $CI_COMMIT_REF_NAME == "main"

dependency-audit:
  stage: security
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir pip-audit
  script:
    - |
      echo "Checking for vulnerable dependencies..."
      echo "=== Dependency Vulnerability Report ===" > dependency-report.txt
      echo "Timestamp: $(date)" >> dependency-report.txt
      echo "" >> dependency-report.txt

      # Run pip-audit
      pip-audit -r requirements.txt --format json > pip-audit.json 2>&1 || true
      pip-audit -r requirements.txt >> dependency-report.txt 2>&1 || true

      # Count vulnerabilities
      VULN_COUNT=$(python -c "import json; d=json.load(open('pip-audit.json')); print(len(d.get('dependencies', [])))" 2>/dev/null || echo "0")

      if [ "$VULN_COUNT" != "0" ]; then
        echo "WARNING: Found $VULN_COUNT vulnerable dependencies" >> dependency-report.txt
      else
        echo "No known vulnerabilities found" >> dependency-report.txt
        echo "OK: Dependency audit passed"
      fi
  artifacts:
    when: always
    paths:
      - dependency-report.txt
      - pip-audit.json
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME != "main"
    - if: $CI_COMMIT_REF_NAME == "main"
  environment:
    name: testing
    action: stop

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "Preparing Docker build..."
    - apk add --no-cache bash curl
  script:
    - |
      if [ -f "$VERSION_FILE" ]; then
        SEMANTIC_VERSION=$(cat $VERSION_FILE)
        echo "Using semantic version from VERSION file: $SEMANTIC_VERSION"
        IMAGE_TAG="$SEMANTIC_VERSION"
      else
        IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
        echo "No VERSION file found, using commit SHA: $IMAGE_TAG"
      fi
    - |
      echo "Authenticating with Azure Container Registry..."
      echo "$AZURE_CLIENT_SECRET" | docker login "$DOCKER_REGISTRY" --username "$AZURE_CLIENT_ID" --password-stdin
    - |
      echo "Building Docker image..."
      docker build -f Dockerfile -t ${DOCKER_IMAGE_NAME}:${IMAGE_TAG} -t ${DOCKER_IMAGE_NAME}:${LATEST_TAG} .
    - |
      echo "Tagging image for ACR..."
      docker tag ${DOCKER_IMAGE_NAME}:${IMAGE_TAG} ${DOCKER_IMAGE_URI}:${IMAGE_TAG}
      docker tag ${DOCKER_IMAGE_NAME}:${LATEST_TAG} ${DOCKER_IMAGE_URI}:${LATEST_TAG}
    - |
      echo "Pushing image to Azure Container Registry..."
      docker push ${DOCKER_IMAGE_URI}:${IMAGE_TAG}
      docker push ${DOCKER_IMAGE_URI}:${LATEST_TAG}
      echo "OK: Docker image pushed successfully"
      echo "   Version tag: ${DOCKER_IMAGE_URI}:${IMAGE_TAG}"
      echo "   Latest tag: ${DOCKER_IMAGE_URI}:${LATEST_TAG}"
      echo "echo ${IMAGE_TAG}"
      echo "${IMAGE_TAG}" > ../$VERSION_FILE
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^staging\/mr-.*$/
    - if: $CI_COMMIT_REF_NAME == "main"
  artifacts:
    when: on_success
    access: all
    paths:
      - $VERSION_FILE
    expire_in: 1 day

# ============================================
# AUTO-PUSH TO STAGING BRANCH
# ============================================
# When a merge request is created, this job automatically:
# 1. Creates a staging branch named: staging/mr-{MR_NUMBER}-{SOURCE_BRANCH_NAME}
# 2. Pushes the MR code to that staging branch
# 3. Triggers the deployment pipeline on the staging branch
# 4. Creates a unique staging environment for each MR

push-to-staging:
  stage: push:staging
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
  before_script:
    - apk add --no-cache git curl
    - git config --global user.email "gitlab-ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - echo "Pushing merge request code to staging branch..."
    - echo "Source branch $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
    - echo "Target branch $CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - echo "MR IID $CI_MERGE_REQUEST_IID"
    - export STAGING_BRANCH="staging/mr-${CI_MERGE_REQUEST_IID}-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
    - echo "Staging branch $STAGING_BRANCH"
    - git fetch origin
    - git checkout -B $STAGING_BRANCH
    - git push -f origin $STAGING_BRANCH
    - echo "Successfully pushed to staging branch $STAGING_BRANCH"
    - |
      # IMMEDIATELY set commit status to PENDING on the MR - this BLOCKS merging
      # This runs in the MR pipeline context, so we have access to CI_COMMIT_SHA
      echo "Setting commit status to PENDING to block MR merge..."
      if [ -n "$GITLAB_API_TOKEN" ]; then
        curl --silent --request POST \
          --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          --header "Content-Type: application/json" \
          --data '{
            "state": "pending",
            "name": "staging/mr-*",
            "target_url": "'"${CI_PROJECT_URL}/-/environments"'",
            "description": "Deploy to staging environment and test before cleanup"
          }' \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/statuses/${CI_COMMIT_SHA}"
        echo "MR merge is now BLOCKED until staging is tested and cleaned up"
      else
        echo "ERROR: GITLAB_API_TOKEN not set - cannot block MR merge!"
        echo "Please add a Project Access Token with 'api' scope as GITLAB_API_TOKEN"
        exit 1
      fi
    - |
      # Protect the staging branch via GitLab API
      ENCODED_BRANCH=$(echo "$STAGING_BRANCH" | sed 's/\//%2F/g')
      if [ -n "$GITLAB_API_TOKEN" ]; then
        echo "Protecting staging branch via API..."
        curl --silent --request POST \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          --header "Content-Type: application/json" \
          --data '{
            "name": "'"$STAGING_BRANCH"'",
            "push_access_level": 40,
            "merge_access_level": 40,
            "allow_force_push": true
          }' \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/protected_branches" || echo "Branch protection may already exist"
        echo "Staging branch protected: $STAGING_BRANCH"
      else
        echo "Warning: GITLAB_API_TOKEN not set - branch will not be protected"
        echo "Create a Project Access Token with 'api' scope and add as GITLAB_API_TOKEN variable"
      fi
    - echo "Triggering pipeline on staging branch..."
    - |
      if [ -n "$CI_TRIGGER_TOKEN" ]; then
        curl --request POST \
          --form "token=${CI_TRIGGER_TOKEN}" \
          --form "ref=${STAGING_BRANCH}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/trigger/pipeline"
        echo "Pipeline triggered on staging branch"
      else
        echo "Warning: CI_TRIGGER_TOKEN not set. Please add a pipeline trigger token."
        echo "Go to Settings -> CI/CD -> Pipeline trigger tokens -> Add new token"
        echo "Then add CI_TRIGGER_TOKEN variable with the token value"
      fi
    - |
      echo "Staging branch $STAGING_BRANCH" > staging-branch-info.txt
      echo "MR IID $CI_MERGE_REQUEST_IID" >> staging-branch-info.txt
      echo "Source $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" >> staging-branch-info.txt
      echo "MR_PIPELINE_SHA $CI_COMMIT_SHA" >> staging-branch-info.txt
      echo "Protected: true" >> staging-branch-info.txt
      echo "Pushed at $(date)" >> staging-branch-info.txt
  artifacts:
    when: always
    paths:
      - staging-branch-info.txt
    expire_in: 1 day

# ============================================
# STAGING ENVIRONMENT DEPLOYMENT
# ============================================

deploy-staging:
  stage: deploy:staging
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^staging\/mr-.*$/
      when: manual
  before_script:
    - |
      echo "Authenticating with Azure..."
      if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] || [ -z "$AZURE_TENANT_ID" ]; then
        echo "Error: Missing Azure credentials. Ensure variables are configured as protected."
        echo "Staging deployment requires protected branch or manual pipeline trigger."
        exit 1
      fi
      az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
  script:
    - |
      if [ -f "$VERSION_FILE" ]; then
        SEMANTIC_VERSION=$(cat $VERSION_FILE)
        IMAGE_TAG="$SEMANTIC_VERSION"
      else
        IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
      fi

      # Extract MR number from staging branch name if available (POSIX-compatible)
      MR_NUMBER=$(echo "$CI_COMMIT_REF_NAME" | sed -n 's/^staging\/mr-\([0-9]*\)-.*/\1/p')
      if [ -n "$MR_NUMBER" ]; then
        STAGING_WEBAPP_NAME="${AZURE_WEBAPP_NAME}-staging-mr${MR_NUMBER}"
      else
        STAGING_WEBAPP_NAME="${AZURE_WEBAPP_NAME}-staging-${IMAGE_TAG}"
      fi

      echo "Creating staging environment: ${STAGING_WEBAPP_NAME}"
      echo "Staging deployment started at $(date)" > staging-deployment-report.txt
      echo "Environment: STAGING" >> staging-deployment-report.txt
      echo "Image tag: $IMAGE_TAG" >> staging-deployment-report.txt
      echo "Target: ${STAGING_WEBAPP_NAME}" >> staging-deployment-report.txt
      echo "Branch: $CI_COMMIT_REF_NAME" >> staging-deployment-report.txt
    - |
      # Create staging web app if it doesn't exist
      echo "Checking if staging web app exists..."
      if ! az webapp show --name ${STAGING_WEBAPP_NAME} --resource-group $AZURE_RESOURCE_GROUP &> /dev/null; then
        echo "Creating new staging web app: ${STAGING_WEBAPP_NAME}"
        az webapp create \
          --resource-group $AZURE_RESOURCE_GROUP \
          --plan $AZURE_APP_SERVICE_PLAN \
          --name ${STAGING_WEBAPP_NAME} \
          --deployment-container-image-name $DOCKER_IMAGE_URI:$IMAGE_TAG >> staging-deployment-report.txt 2>&1
      else
        echo "Staging web app already exists: ${STAGING_WEBAPP_NAME}"
      fi
    - |
      # Configure container for staging
      echo "Configuring container for staging environment..."
      az webapp config container set \
        --name ${STAGING_WEBAPP_NAME} \
        --resource-group $AZURE_RESOURCE_GROUP \
        --container-image-name $DOCKER_IMAGE_URI:$IMAGE_TAG \
        --container-registry-url https://$DOCKER_REGISTRY \
        --container-registry-user $AZURE_CLIENT_ID \
        --container-registry-password $AZURE_CLIENT_SECRET >> staging-deployment-report.txt 2>&1

      az webapp restart --name ${STAGING_WEBAPP_NAME} --resource-group $AZURE_RESOURCE_GROUP >> staging-deployment-report.txt 2>&1
      sleep 60
    - |
      # Health check for staging environment
      echo "Performing health checks on staging environment..."
      HEALTH_PASSED=false
      for i in {1..30}; do
        response_code=$(curl -s -o /dev/null -w "%{http_code}" "https://${STAGING_WEBAPP_NAME}.azurewebsites.net" || echo "000")
        if [ "$response_code" = "200" ]; then
          echo "Staging environment comprehensive health check passed (attempt $i)" >> staging-deployment-report.txt
          echo "Response code: $response_code" >> staging-deployment-report.txt
          HEALTH_PASSED=true
          break
        fi
        echo "Health check attempt $i failed (HTTP $response_code), retrying in 10s..." >> staging-deployment-report.txt
        sleep 10
      done

      if [ "$HEALTH_PASSED" = "false" ]; then
        echo "Staging environment health check failed after 5 minutes" >> staging-deployment-report.txt
        exit 1
      fi
    - |
      echo "Staging deployment completed successfully!"
      echo "Staging URL: https://${STAGING_WEBAPP_NAME}.azurewebsites.net"
      echo ""
      echo "============================================"
      echo "TESTING INSTRUCTIONS:"
      echo "============================================"
      echo "1. Test the application at: https://${STAGING_WEBAPP_NAME}.azurewebsites.net"
      echo "2. Verify all functionality works as expected"
      echo "3. When testing is complete, run 'stop-staging' job to:"
      echo "   - Delete the staging environment"
      echo "   - Unblock the MR for merging"
      echo "   - Clean up the staging branch"
      echo "============================================"
      echo ""
      echo "Staging deployment completed at $(date)" >> staging-deployment-report.txt
      echo "Status: SUCCESS - Ready for testing" >> staging-deployment-report.txt
  artifacts:
    when: always
    paths:
      - staging-deployment-report.txt
    expire_in: 1 month
  environment:
    name: staging
    url: https://${STAGING_WEBAPP_NAME}.azurewebsites.net
    on_stop: stop-staging
    deployment_tier: staging
    auto_stop_in: 3 days

stop-staging:
  stage: deploy:staging
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^staging\/mr-.*$/
      when: manual
  before_script:
    - |
      echo "Authenticating with Azure..."
      az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
    - |
      # Install curl to fetch artifacts from the original MR pipeline
      apt-get update && apt-get install -y curl jq
  script:
    - |
      # Extract MR number from staging branch name (POSIX-compatible)
      MR_NUMBER=$(echo "$CI_COMMIT_REF_NAME" | sed -n 's/^staging\/mr-\([0-9]*\)-.*/\1/p')
      if [ -n "$MR_NUMBER" ]; then
        STAGING_WEBAPP_NAME="${AZURE_WEBAPP_NAME}-staging-mr${MR_NUMBER}"
      else
        STAGING_WEBAPP_NAME="${AZURE_WEBAPP_NAME}-staging-${CI_COMMIT_SHORT_SHA}"
      fi

      echo "Deleting staging environment: ${STAGING_WEBAPP_NAME}"
      if az webapp show --name ${STAGING_WEBAPP_NAME} --resource-group ${AZURE_RESOURCE_GROUP} &> /dev/null; then
        az webapp delete --name ${STAGING_WEBAPP_NAME} --resource-group ${AZURE_RESOURCE_GROUP} --keep-empty-plan
        echo "Azure Web App deleted: ${STAGING_WEBAPP_NAME}"
      else
        echo "Web app not found or already deleted: ${STAGING_WEBAPP_NAME}"
      fi
    - |
      # Set commit status to SUCCESS - this unblocks the MR for merging
      echo "Setting commit status on MR to allow merge..."
      MR_IID=$(echo "$CI_COMMIT_REF_NAME" | sed -n 's/^staging\/mr-\([0-9]*\)-.*/\1/p')

      if [ -n "$MR_IID" ] && [ -n "$GITLAB_API_TOKEN" ]; then
        echo "MR IID: $MR_IID"

        # Get the original MR pipeline SHA from the push-to-staging artifact
        echo "Fetching original MR pipeline SHA from push-to-staging job..."
        MR_PIPELINE_INFO=$(curl --silent --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}/pipelines?scope=all&order_by=id&sort=desc" | \
          jq -r '.[0]')

        ORIGINAL_PIPELINE_ID=$(echo "$MR_PIPELINE_INFO" | jq -r '.id')
        ORIGINAL_SHA=$(echo "$MR_PIPELINE_INFO" | jq -r '.sha')

        echo "Original MR Pipeline ID: $ORIGINAL_PIPELINE_ID"
        echo "Original MR Pipeline SHA: $ORIGINAL_SHA"

        # Also get MR details for additional SHAs
        MR_INFO=$(curl --silent --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${MR_IID}")

        MR_SHA=$(echo "$MR_INFO" | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4)
        HEAD_SHA=$(echo "$MR_INFO" | grep -o '"head_sha":"[^"]*"' | head -1 | cut -d'"' -f4)

        echo "MR SHA: $MR_SHA"
        echo "Head SHA: $HEAD_SHA"

        # Set status on ALL possible SHAs - especially the ORIGINAL_SHA from the MR pipeline
        for SHA in $ORIGINAL_SHA $MR_SHA $HEAD_SHA; do
          if [ -n "$SHA" ] && [ "$SHA" != "null" ]; then
            echo "Setting commit status 'staging/mr-*' to success on $SHA"
            RESULT=$(curl --silent --request POST \
              --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{
                "state": "success",
                "name": "staging/mr-*",
                "target_url": "'"${CI_PIPELINE_URL}"'",
                "description": "Staging tested and cleaned up - ready to merge"
              }' \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/statuses/${SHA}")
            echo "Status set on $SHA"
          fi
        done
        echo "SUCCESS: MR merge should now be UNBLOCKED!"
      else
        echo "Warning: Missing MR_IID or GITLAB_API_TOKEN"
      fi
  environment:
    name: staging
    action: stop

# Staging cleanup - Unprotects and deletes staging branch
# Requires GITLAB_API_TOKEN: Project Access Token with 'api' scope
cleanup-staging:
  stage: deploy:staging
  image: alpine:latest
  needs:
    - job: stop-staging
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^staging\/mr-.*$/
      when: on_success
  before_script:
    - |
      apk add --no-cache git curl
      git config --global user.email "gitlab-ci@gitlab.com"
      git config --global user.name "GitLab CI"
      git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - |
      echo "========================================"
      echo "STAGING CLEANUP - Branch Teardown"
      echo "========================================"
      echo "Branch: $CI_COMMIT_REF_NAME"
      echo "Cleanup started at $(date)" > cleanup-report.txt
    - |
      # Step 1: Unprotect the staging branch
      echo "Step 1: Unprotecting staging branch..."
      ENCODED_BRANCH=$(echo "$CI_COMMIT_REF_NAME" | sed 's/\//%2F/g')

      if [ -n "$GITLAB_API_TOKEN" ]; then
        echo "Removing branch protection via API..."
        UNPROTECT_RESPONSE=$(curl --silent --write-out "\nHTTP_CODE:%{http_code}" --request DELETE \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/protected_branches/${ENCODED_BRANCH}")
        HTTP_CODE=$(echo "$UNPROTECT_RESPONSE" | grep "HTTP_CODE" | cut -d':' -f2)

        if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "404" ]; then
          echo "Branch protection removed" >> cleanup-report.txt
          echo "SUCCESS: Branch protection removed"
        else
          echo "Warning: Could not remove protection (HTTP $HTTP_CODE)" >> cleanup-report.txt
        fi
      else
        echo "WARNING: GITLAB_API_TOKEN not set - cannot unprotect branch" >> cleanup-report.txt
        echo "WARNING: GITLAB_API_TOKEN not set"
      fi
    - |
      # Step 2: Delete the staging branch
      echo "Step 2: Deleting staging branch..."
      if [ -n "$GITLAB_API_TOKEN" ]; then
        echo "Deleting branch via API..."
        DELETE_RESPONSE=$(curl --silent --write-out "\nHTTP_CODE:%{http_code}" --request DELETE \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/branches/${ENCODED_BRANCH}")
        HTTP_CODE=$(echo "$DELETE_RESPONSE" | grep "HTTP_CODE" | cut -d':' -f2)

        if [ "$HTTP_CODE" = "204" ]; then
          echo "Branch deleted: $CI_COMMIT_REF_NAME" >> cleanup-report.txt
          echo "SUCCESS: Staging branch deleted"
        else
          echo "Warning: Could not delete branch via API (HTTP $HTTP_CODE)" >> cleanup-report.txt
          echo "Trying git push --delete..."
          git push origin --delete "$CI_COMMIT_REF_NAME" 2>&1 && echo "Branch deleted via git" >> cleanup-report.txt || echo "Could not delete branch" >> cleanup-report.txt
        fi
      else
        echo "Trying to delete branch via git..."
        git push origin --delete "$CI_COMMIT_REF_NAME" 2>&1 && echo "Branch deleted via git" >> cleanup-report.txt || echo "Could not delete branch - manual deletion required" >> cleanup-report.txt
      fi
    - |
      echo "========================================"
      echo "CLEANUP COMPLETE"
      echo "========================================"
      echo "Cleanup completed at $(date)" >> cleanup-report.txt
      cat cleanup-report.txt
      # Note: Commit status is set in stop-staging job to unblock MR immediately
  artifacts:
    when: always
    paths:
      - cleanup-report.txt
    expire_in: 1 week
  allow_failure: true

# ============================================
# PRODUCTION ENVIRONMENT DEPLOYMENT
# ============================================

deploy-production:
  stage: deploy:production
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: manual
  before_script:
    - |
      echo "Authenticating with Azure..."
      if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] || [ -z "$AZURE_TENANT_ID" ]; then
        echo "Error: Missing Azure credentials. Ensure variables are configured as protected."
        echo "Production deployment requires main branch or protected branch."
        exit 1
      fi
      az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
  script:
    - |
      if [ -f "$VERSION_FILE" ]; then
        SEMANTIC_VERSION=$(cat $VERSION_FILE)
        IMAGE_TAG="$SEMANTIC_VERSION"
      else
        IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
      fi
      echo "=== PRODUCTION DEPLOYMENT ==="
      echo "Production deployment started at $(date)" > production-deployment-report.txt
      echo "Environment: PRODUCTION" >> production-deployment-report.txt
      echo "Image tag: $IMAGE_TAG" >> production-deployment-report.txt
      echo "Target: ${PRODUCTION_WEBAPP_NAME}" >> production-deployment-report.txt
      echo "Pipeline ID: $CI_PIPELINE_ID" >> production-deployment-report.txt
      echo "Commit SHA: $CI_COMMIT_SHA" >> production-deployment-report.txt
    - |
      # Store current production version for rollback
      echo "Backing up current production configuration..."
      CURRENT_IMAGE=$(az webapp config container show \
        --name ${PRODUCTION_WEBAPP_NAME} \
        --resource-group ${AZURE_RESOURCE_GROUP} \
        --query "[0].name" -o tsv 2>/dev/null || echo "unknown")
      echo "Previous production image: $CURRENT_IMAGE" >> production-deployment-report.txt

      # Store deployment metadata for rollback
      echo "$IMAGE_TAG" > current-production-version.txt
      echo "$CI_PIPELINE_ID" > current-production-pipeline.txt
      echo "$(date -Iseconds)" > production-deployment-timestamp.txt
      echo "$CURRENT_IMAGE" > previous-production-version.txt
    - |
      # Production deployment with extra safety
      echo "Deploying to PRODUCTION Environment: ${PRODUCTION_WEBAPP_NAME}"
      echo "CRITICAL: Production deployment in progress..." >> production-deployment-report.txt

      az webapp config container set \
        --name ${PRODUCTION_WEBAPP_NAME} \
        --resource-group ${AZURE_RESOURCE_GROUP} \
        --container-image-name ${DOCKER_IMAGE_URI}:${IMAGE_TAG} \
        --container-registry-url https://${DOCKER_REGISTRY} \
        --container-registry-user ${AZURE_CLIENT_ID} \
        --container-registry-password ${AZURE_CLIENT_SECRET} >> production-deployment-report.txt 2>&1

      echo "Restarting production application..." >> production-deployment-report.txt
      az webapp restart --name ${PRODUCTION_WEBAPP_NAME} --resource-group ${AZURE_RESOURCE_GROUP} >> production-deployment-report.txt 2>&1
      sleep 60
    - |
      # Critical production health checks
      echo "Performing CRITICAL production health checks..."
      HEALTH_PASSED=false
      RESPONSE_TIME_OK=false

      for i in {1..60}; do
        start_time=$(date +%s)
        response_code=$(curl -s -o /dev/null -w "%{http_code}" "https://${PRODUCTION_WEBAPP_NAME}.azurewebsites.net")
        end_time=$(date +%s)
        response_time=$((end_time - start_time))

        if [ "$response_code" = "200" ]; then
          if [ $response_time -lt 10 ]; then
            echo "Production health check PASSED (attempt $i)" >> production-deployment-report.txt
            echo "   Response code: $response_code" >> production-deployment-report.txt
            echo "   Response time: ${response_time}s" >> production-deployment-report.txt
            HEALTH_PASSED=true
            RESPONSE_TIME_OK=true
            break
          else
            echo "Slow response time: ${response_time}s (attempt $i)" >> production-deployment-report.txt
          fi
        else
          echo "Health check failed: HTTP $response_code (attempt $i)" >> production-deployment-report.txt
        fi

        sleep 10
      done

      if [ "$HEALTH_PASSED" = "false" ]; then
        echo "CRITICAL: Production health check FAILED after 10 minutes" >> production-deployment-report.txt
        echo "Initiating automatic rollback..." >> production-deployment-report.txt
        # Auto-rollback logic would go here in a real system
        exit 1
      fi
    - |
      # Success notifications
      echo "PRODUCTION DEPLOYMENT SUCCESSFUL!"
      echo ""
      echo "============================================"
      echo "PRODUCTION DEPLOYMENT COMPLETE"
      echo "============================================"
      echo "Production URL: https://${PRODUCTION_WEBAPP_NAME}.azurewebsites.net"
      echo "Deployed version: $IMAGE_TAG"
      echo "Pipeline ID: $CI_PIPELINE_ID"
      echo ""
      echo "Please verify the production application is working correctly."
      echo "============================================"
      echo ""

      echo "Production deployment COMPLETED SUCCESSFULLY!" >> production-deployment-report.txt
      echo "Production URL: https://${PRODUCTION_WEBAPP_NAME}.azurewebsites.net" >> production-deployment-report.txt
      echo "Production deployment completed at $(date)" >> production-deployment-report.txt
      echo "Status: SUCCESS" >> production-deployment-report.txt
      echo "Health check: PASSED" >> production-deployment-report.txt
  artifacts:
    when: always
    paths:
      - production-deployment-report.txt
      - current-production-version.txt
      - current-production-pipeline.txt
      - production-deployment-timestamp.txt
      - previous-production-version.txt
    expire_in: 6 months
  environment:
    name: production
    url: https://${PRODUCTION_WEBAPP_NAME}.azurewebsites.net
    on_stop: stop-production
    deployment_tier: production

  allow_failure: false

stop-production:
  stage: deploy:production
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: manual
  allow_failure: true
  before_script:
    - |
      echo "Authenticating with Azure..."
      az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
  script:
    - |
      echo "STOPPING PRODUCTION ENVIRONMENT"
      echo "Production stop initiated at $(date)" > production-stop-report.txt
      echo "Pipeline ID: $CI_PIPELINE_ID" >> production-stop-report.txt

      az webapp stop --name ${PRODUCTION_WEBAPP_NAME} --resource-group ${AZURE_RESOURCE_GROUP} >> production-stop-report.txt 2>&1
      echo "Production environment stopped at $(date)" >> production-stop-report.txt
  artifacts:
    when: always
    paths:
      - production-stop-report.txt
    expire_in: 6 months
  when: manual
  environment:
    name: production
    action: stop

# ============================================
# POST-DEPLOYMENT VERIFICATION
# ============================================

# Smoke testing disabled - tests run locally only
# smoke:testing job removed since testing deployment is disabled

# ============================================
# RELEASE MANAGEMENT
# ============================================

create-version-tag:
  stage: release
  image: alpine:latest
  script:
    - |
      if [ -f "$VERSION_FILE" ]; then
        VERSION=$(cat $VERSION_FILE)
        echo "Current version: $VERSION"
      else
        echo "Error: VERSION file not found"
        echo "Create a VERSION file with semantic version (e.g., 1.0.0)"
        exit 1
      fi
  artifacts:
    paths:
      - $VERSION_FILE
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"

list-versions:
  stage: release
  image: mcr.microsoft.com/azure-cli:latest
  before_script:
    - |
      echo "Authenticating with Azure..."
      az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
  script:
    - |
      echo "Available versions in container registry:"
      echo "==========================================="
      az acr repository show-tags --name ${ACR_NAME} --repository ${DOCKER_IMAGE_NAME} --orderby time_desc --output table | tee versions-report.txt
      echo ""
      echo "Tip: To rollback to a previous version:"
      echo "1. Go to CI/CD -> Pipelines"
      echo "2. Click the play button on 'deploy:rollback:manual'"
      echo "3. Set ROLLBACK_VERSION to the version from the list above (e.g., 1.2.3)"
      echo "4. Click 'Play'"
    - echo "Version list generated at $(date)" >> versions-report.txt
  artifacts:
    when: always
    paths:
      - versions-report.txt
    expire_in: 1 month
  when: manual
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"

# ============================================
# RELEASE TAG CREATION
# ============================================

create-release-tag:
  stage: release
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: on_success
  needs:
    - job: deploy-production
      artifacts: true
  script:
    - |
      if [ -f "$VERSION_FILE" ]; then
        VERSION=$(cat $VERSION_FILE)
      else
        VERSION="${CI_COMMIT_SHORT_SHA}"
      fi

      echo "Creating release information for v${VERSION}"
      echo "Release: v${VERSION}" > release-info.txt
      echo "Commit: ${CI_COMMIT_SHA}" >> release-info.txt
      echo "Date: $(date)" >> release-info.txt
      echo "Production deployment completed successfully" >> release-info.txt
      echo "Suggested tag: v${VERSION}" >> release-info.txt

      echo "Release preparation completed successfully"
      echo "Version: ${VERSION}"
      echo "Commit: ${CI_COMMIT_SHA}"
  artifacts:
    when: always
    paths:
      - release-info.txt
    expire_in: 6 months
