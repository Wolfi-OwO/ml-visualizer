# =====================================================
# GitLab CI/CD Pipeline - Dynamic Environments Edition
# =====================================================
# This pipeline uses:
# - Dynamic environments based on GitLab variables ($CI_COMMIT_REF_SLUG, $CI_MERGE_REQUEST_IID)
# - Official GitLab CI templates for Docker builds
# - Built-in GitLab CI variables (CI_REGISTRY_IMAGE, etc.)
# - No branch-based staging logic
# - Auto-stop and cleanup for ephemeral environments
# =====================================================

include:
  # Security scanning templates
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

stages:
  - validate
  - lint
  - test
  - security
  - build
  - deploy:review
  - deploy:production
  - release
  - pages
  - cleanup

image: mcr.microsoft.com/azure-cli:latest

# =====================================================
# Variables - Using Built-in GitLab CI Variables Only
# =====================================================
variables:
  DOCKER_IMAGE_NAME: "ml-visualizer"
  # Use GitLab built-in registry if available, otherwise use custom registry
  DOCKER_REGISTRY: "${ACR_NAME}.azurecr.io"
  DOCKER_IMAGE_URI: "${DOCKER_REGISTRY}/ml-visualizer"

  LATEST_TAG: "latest"
  APP_DIR: "."

  # Health Check Configuration
  HEALTH_CHECK_TIMEOUT: "300"
  HEALTH_CHECK_INTERVAL: "10"

  # Deployment Configuration
  DEPLOYMENT_TIMEOUT: "600"

  # Dynamic Environment Settings
  REVIEW_APP_AUTO_STOP_IN: "1 day"
  REVIEW_APP_DEPLOYMENT_TIMEOUT: "300"

# =====================================================
# VALIDATION STAGE
# =====================================================

.validate_base:
  stage: validate
  rules:
    # Run for merge requests and main branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_TAG

check-variables:
  extends: .validate_base
  image: alpine:latest
  script:
    - |
      echo "Validating required GitLab built-in CI variables..."
      echo "✓ CI_REGISTRY: $DOCKER_REGISTRY"
      echo "✓ CI_REGISTRY_IMAGE: $DOCKER_IMAGE_URI"
      echo "✓ CI_REGISTRY_USER: $ACR_USERNAME"
      echo "✓ CI_COMMIT_REF_SLUG: $CI_COMMIT_REF_SLUG"
      echo "✓ CI_PROJECT_ID: $CI_PROJECT_ID"

      # Check for Azure deployment credentials (only on protected branches/main)
      if [ "$CI_COMMIT_REF_PROTECTED" = "true" ] || [ "$CI_COMMIT_REF_NAME" = "main" ]; then
        echo "Running on protected branch - validating Azure credentials..."
        for var in AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_WEBAPP_NAME; do
          if eval "[ -z \"\$$var\" ]"; then
            echo "⚠ Missing protected variable: $var"
          else
            echo "✓ $var: [set]"
          fi
        done
      fi

      echo "OK: Variable validation completed"

check-dockerfile:
  extends: .validate_base
  image: alpine:latest
  script:
    - |
      echo "✓ Checking Dockerfile..."
      [ -f "Dockerfile" ] || exit 1
      echo "✓ Dockerfile found"

      echo "✓ Checking requirements.txt..."
      [ -f "requirements.txt" ] || exit 1
      echo "✓ requirements.txt found"

      echo "OK: All required files present"

# =====================================================
# LINT STAGE
# =====================================================

.lint_base:
  extends: .validate_base
  stage: lint

ruff-check:
  extends: .lint_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir ruff
  script:
    - |
      echo "Running ruff linting..."
      ruff check . --output-format=gitlab > ruff-report.json || RUFF_EXIT=$?

      echo "=== Ruff Linting Results ===" > ruff-results.txt
      ruff check . --output-format=text >> ruff-results.txt || true

      if [ -s "ruff-report.json" ]; then
        echo "⚠ Ruff found issues - check Code Quality tab" >> ruff-results.txt
        cat ruff-report.json >> ruff-results.txt
      else
        echo "✓ No ruff issues found" >> ruff-results.txt
      fi
  artifacts:
    when: always
    paths:
      - ruff-results.txt
    reports:
      codequality: ruff-report.json
    expire_in: 1 week

# =====================================================
# TEST STAGE
# =====================================================

.test_base:
  extends: .validate_base
  stage: test

syntax-check:
  extends: .test_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - |
      echo "✓ Running Python syntax checks..."
      python -m py_compile ./src/app.py
      for file in ./src/pages/*.py; do
        python -m py_compile "$file"
      done

      echo "✓ Checking imports..."
      python -c "import streamlit; import numpy; import pandas; import matplotlib; print('✓ All imports available')"

      echo "OK: Syntax checks passed"

unit-tests:
  extends: .test_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir -r requirements.txt
  script:
    - |
      echo "Running unit tests with pytest and coverage..."
      python -m pytest src/tests/ -v --tb=short \
        --cov=. \
        --cov-config=pyproject.toml \
        --cov-report=term-missing \
        --cov-report=xml:coverage.xml \
        --cov-report=html:htmlcov \
        --junitxml=junit.xml || TEST_EXIT=$?

      if [ -z "$TEST_EXIT" ]; then
        echo "✓ All tests passed"
      else
        exit $TEST_EXIT
      fi
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - htmlcov/
      - junit.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit.xml
    expire_in: 1 week

# =====================================================
# SECURITY SCANNING STAGE
# =====================================================
# Uses official GitLab templates for security scanning

.security_base:
  extends: .validate_base
  stage: security
  allow_failure: true

bandit-scan:
  extends: .security_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir bandit
  script:
    - |
      echo "Running Bandit security scanner..."
      bandit -r . -f json -o bandit-report.json --exclude ./tests,./htmlcov,./.pytest_cache || true
      bandit -r . -f txt --exclude ./tests,./htmlcov,./.pytest_cache > security-report.txt 2>&1 || true

      HIGH_ISSUES=$(bandit -r . -f json --exclude ./tests,./htmlcov,./.pytest_cache 2>/dev/null | \
                   python -c "import sys,json; d=json.load(sys.stdin); print(len([r for r in d.get('results',[]) if r.get('issue_severity')=='HIGH']))" 2>/dev/null || echo "0")

      if [ "$HIGH_ISSUES" != "0" ]; then
        echo "⚠ Found $HIGH_ISSUES high severity security issues"
      else
        echo "✓ No high severity security issues found"
      fi
  artifacts:
    when: always
    paths:
      - security-report.txt
      - bandit-report.json
    expire_in: 1 week

dependency-audit:
  extends: .security_base
  image: python:3.10-slim
  before_script:
    - pip install --no-cache-dir pip-audit
  script:
    - |
      echo "Checking for vulnerable dependencies..."
      pip-audit -r requirements.txt --format json > pip-audit.json 2>&1 || true
      pip-audit -r requirements.txt > dependency-report.txt 2>&1 || true

      VULN_COUNT=$(python -c "import json; d=json.load(open('pip-audit.json')); print(len(d.get('dependencies', [])))" 2>/dev/null || echo "0")

      if [ "$VULN_COUNT" != "0" ]; then
        echo "⚠ Found $VULN_COUNT vulnerable dependencies"
      else
        echo "✓ No known vulnerabilities found"
      fi
  artifacts:
    when: always
    paths:
      - dependency-report.txt
      - pip-audit.json
    expire_in: 1 week


# =====================================================
# BUILD STAGE - Docker Build using Official GitLab Template
# =====================================================

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - |
      echo "Authenticating with Azure Container Registry..."
      echo "$ACR_PASSWORD" | docker login -u "$ACR_USERNAME" --password-stdin "$DOCKER_REGISTRY"
  script:
    - |
      # Determine image tag: prefer tag name, fallback to commit SHA
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
        echo "✓ Using tag for production build: $IMAGE_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
        echo "✓ Using commit SHA for non-tag build: $IMAGE_TAG"
      fi

      echo "$IMAGE_TAG" > image_tag.txt
    - |
      echo "Building Docker image..."
      docker build \
        -f Dockerfile \
        --build-arg APP_VERSION="${IMAGE_TAG}" \
        -t "${DOCKER_IMAGE_NAME}:${IMAGE_TAG}" \
        -t "${DOCKER_IMAGE_NAME}:${LATEST_TAG}" \
        .

      echo "✓ Docker image built successfully"
    - |
      echo "Tagging image for Azure Container Registry..."
      docker tag "${DOCKER_IMAGE_NAME}:${IMAGE_TAG}" "${DOCKER_IMAGE_URI}:${IMAGE_TAG}"
      docker tag "${DOCKER_IMAGE_NAME}:${LATEST_TAG}" "${DOCKER_IMAGE_URI}:${LATEST_TAG}"

      echo "Pushing image to Azure Container Registry..."
      docker push "${DOCKER_IMAGE_URI}:${IMAGE_TAG}"
      docker push "${DOCKER_IMAGE_URI}:${LATEST_TAG}"

      echo "✓ Docker image pushed successfully"
      echo "  Version tag: ${DOCKER_IMAGE_URI}:${IMAGE_TAG}"
      echo "  Latest tag: ${DOCKER_IMAGE_URI}:${LATEST_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  artifacts:
    when: on_success
    access: all
    paths:
      - image_tag.txt
    expire_in: 1 day

# =====================================================
# DEPLOY TO REVIEW ENVIRONMENTS (Dynamic)
# =====================================================
# These environments are automatically created and destroyed
# based on merge requests. No branch-based staging logic.

.deploy_review_base:
  stage: deploy:review
  image: mcr.microsoft.com/azure-cli:latest
  needs:
    - job: docker-build
      artifacts: true
  rules:
    # Only for merge requests
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  before_script:
    - |
      echo "Authenticating with Azure..."
      az login --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --password "$AZURE_CLIENT_SECRET" \
        --tenant "$AZURE_TENANT_ID"
      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      tdnf install -y curl jq

deploy-review:
  extends: .deploy_review_base
  environment:
    # Dynamic environment name based on commit SHA for staging
    name: staging/$CI_COMMIT_SHORT_SHA
    # URL dynamically set after deployment
    url: https://$REVIEW_APP_FQDN
    auto_stop_in: $REVIEW_APP_AUTO_STOP_IN
    deployment_tier: staging
  script:
    - |
      # Load image version
      IMAGE_TAG=$(cat image_tag.txt)
      echo "Deploying Docker image version: $IMAGE_TAG"

      # Construct unique app name for this staging environment
      REVIEW_APP_NAME="${AZURE_WEBAPP_NAME}-staging-${CI_COMMIT_SHORT_SHA}"

      echo "Creating/Updating staging environment: $REVIEW_APP_NAME"
      echo "Environment: staging/$CI_COMMIT_SHORT_SHA" > review-deployment-report.txt
      echo "Image tag: $IMAGE_TAG" >> review-deployment-report.txt
      echo "Target: $REVIEW_APP_NAME" >> review-deployment-report.txt
      echo "Deployment started: $(date)" >> review-deployment-report.txt
    - |
      # Create or update Azure Container App
      if ! az containerapp show --name "$REVIEW_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" &>/dev/null; then
        echo "✓ Creating new staging Container App: $REVIEW_APP_NAME"
        az containerapp create \
          --name "$REVIEW_APP_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --environment "$CONTAINERAPPS_ENV" \
          --image "${DOCKER_IMAGE_URI}:${IMAGE_TAG}" \
          --registry-server "$DOCKER_REGISTRY" \
          --registry-username "$ACR_USERNAME" \
          --registry-password "$ACR_PASSWORD" \
          --ingress external \
          --target-port 8501 \
          --min-replicas 0 \
          --max-replicas 1 >> review-deployment-report.txt 2>&1 || {
          echo "✗ Failed to create Container App" >> review-deployment-report.txt
          exit 1
        }
      else
        echo "✓ Staging Container App exists - updating image..."
        az containerapp update \
          --name "$REVIEW_APP_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --image "${DOCKER_IMAGE_URI}:${IMAGE_TAG}" >> review-deployment-report.txt 2>&1

        # Restart the latest revision
        REVISION_NAME=$(az containerapp revision list \
          --name "$REVIEW_APP_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --query '[-1].name' -o tsv 2>/dev/null || echo "")

        if [ -n "$REVISION_NAME" ]; then
          az containerapp revision restart \
            --name "$REVIEW_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$REVISION_NAME" >> review-deployment-report.txt 2>&1
        fi
      fi
    - |
      # Retrieve FQDN and wait for availability
      REVIEW_APP_FQDN=$(az containerapp show \
        --name "$REVIEW_APP_NAME" \
        --resource-group "$AZURE_RESOURCE_GROUP" \
        --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null)

      if [ -z "$REVIEW_APP_FQDN" ]; then
        echo "✗ Could not determine staging Container App FQDN" >> review-deployment-report.txt
        exit 1
      fi

      echo "✓ Staging Container App FQDN: $REVIEW_APP_FQDN" >> review-deployment-report.txt
      export REVIEW_APP_FQDN

      # Perform health checks
      echo "Performing health checks on https://${REVIEW_APP_FQDN}..."
      for i in {1..30}; do
        response_code=$(curl -s -o /dev/null -w "%{http_code}" "https://${REVIEW_APP_FQDN}" || echo "000")
        if [ "$response_code" = "200" ]; then
          echo "✓ Health check passed (attempt $i)" >> review-deployment-report.txt
          echo "✓ Staging environment is ready!" >> review-deployment-report.txt
          break
        fi
        echo "  Health check attempt $i failed (HTTP $response_code), retrying..." >> review-deployment-report.txt
        sleep 10
      done

      echo "Staging deployment completed: $(date)" >> review-deployment-report.txt
      echo "" >> review-deployment-report.txt
      echo "Access staging app at: https://${REVIEW_APP_FQDN}"
  artifacts:
    when: always
    paths:
      - review-deployment-report.txt
    expire_in: 1 week

stop-review:
  extends: .deploy_review_base
  when: manual
  allow_failure: true
  environment:
    name: staging/$CI_COMMIT_SHORT_SHA
    action: stop
  script:
    - |
      echo "Stopping staging environment: staging/$CI_COMMIT_SHORT_SHA"

      REVIEW_APP_NAME="${AZURE_WEBAPP_NAME}-staging-${CI_COMMIT_SHORT_SHA}"

      echo "Deleting Azure Container App: $REVIEW_APP_NAME" > review-stop-report.txt

      if az containerapp show --name "$REVIEW_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
        echo "✓ Found Container App - deleting..."
        az containerapp delete \
          --name "$REVIEW_APP_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --yes >> review-stop-report.txt 2>&1 || {
          echo "⚠ Deletion returned non-zero exit code (may already be deleted)" >> review-stop-report.txt
        }
      else
        echo "✓ Staging Container App already deleted" >> review-stop-report.txt
      fi

      echo "Staging environment cleanup completed: $(date)" >> review-stop-report.txt


# =====================================================
# DEPLOY TO PRODUCTION
# =====================================================
# Production deployments run only on tags
# Requires manual trigger for safety

.deploy_production_base:
  stage: deploy:production
  image: mcr.microsoft.com/azure-cli:latest
  needs:
    - job: docker-build
      artifacts: true

  rules:
    # Only for tagged releases
    - if: $CI_COMMIT_TAG
      when: manual
  before_script:
    - |
      echo "Authenticating with Azure..."
      if [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_SECRET" ] || [ -z "$AZURE_TENANT_ID" ]; then
        echo "✗ Missing Azure credentials"
        exit 1
      fi

      az login --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --password "$AZURE_CLIENT_SECRET" \
        --tenant "$AZURE_TENANT_ID"

      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
      tdnf install -y curl jq

deploy-production:
  extends: .deploy_production_base
  environment:
    name: production
    url: https://$PRODUCTION_FQDN
    deployment_tier: production
    on_stop: stop-production
  script:
    - |
      # Load image version
      IMAGE_TAG=$(cat image_tag.txt)
      echo "Deploying Docker image version: $IMAGE_TAG"

      PRODUCTION_WEBAPP_NAME="${AZURE_WEBAPP_NAME}"

      echo "Deploying to production: $PRODUCTION_WEBAPP_NAME" > production-deployment-report.txt
      echo "Image tag: $IMAGE_TAG" >> production-deployment-report.txt
      echo "Deployment started: $(date)" >> production-deployment-report.txt
    - |
      # Create or update production Container App
      if ! az containerapp show --name "$PRODUCTION_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" &>/dev/null; then
        echo "✓ Creating new production Container App: $PRODUCTION_WEBAPP_NAME"
        az containerapp create \
          --name "$PRODUCTION_WEBAPP_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --environment "$CONTAINERAPPS_ENV" \
          --image "${DOCKER_IMAGE_URI}:${IMAGE_TAG}" \
          --registry-server "$DOCKER_REGISTRY" \
          --registry-username "$ACR_USERNAME" \
          --registry-password "$ACR_PASSWORD" \
          --ingress external \
          --target-port 8501 \
          --min-replicas "${PRODUCTION_MIN_REPLICAS:-0}" \
          --max-replicas "${PRODUCTION_MAX_REPLICAS:-3}" >> production-deployment-report.txt 2>&1 || {
          echo "✗ Failed to create Container App" >> production-deployment-report.txt
          exit 1
        }
      else
        echo "✓ Production Container App exists - updating image..."
        az containerapp update \
          --name "$PRODUCTION_WEBAPP_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --image "${DOCKER_IMAGE_URI}:${IMAGE_TAG}" \
          --set template.scale.minReplicas="${PRODUCTION_MIN_REPLICAS:-0}" \
                 template.scale.maxReplicas="${PRODUCTION_MAX_REPLICAS:-3}" >> production-deployment-report.txt 2>&1

        # Restart the latest revision
        REVISION_NAME=$(az containerapp revision list \
          --name "$PRODUCTION_WEBAPP_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --query '[-1].name' -o tsv 2>/dev/null || echo "")

        if [ -n "$REVISION_NAME" ]; then
          az containerapp revision restart \
            --name "$PRODUCTION_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$REVISION_NAME" >> production-deployment-report.txt 2>&1
        fi
      fi
    - |
      # Retrieve FQDN
      PRODUCTION_FQDN=$(az containerapp show \
        --name "$PRODUCTION_WEBAPP_NAME" \
        --resource-group "$AZURE_RESOURCE_GROUP" \
        --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null)

      if [ -z "$PRODUCTION_FQDN" ]; then
        echo "✗ Could not determine production Container App FQDN" >> production-deployment-report.txt
        exit 1
      fi

      echo "✓ Production Container App FQDN: $PRODUCTION_FQDN" >> production-deployment-report.txt
      export PRODUCTION_FQDN

      echo "Waiting 30s for production container app to warm up..." >> production-deployment-report.txt
      sleep 30
    - |
      # Production health checks (critical stage)
      echo "Performing CRITICAL production health checks against https://${PRODUCTION_FQDN}..."
      for i in {1..60}; do
        response_code=$(curl -s -o /dev/null -w "%{http_code}" "https://${PRODUCTION_FQDN}" || echo "000")
        if [ "$response_code" = "200" ]; then
          echo "✓ Production health check PASSED (attempt $i)" >> production-deployment-report.txt
          echo "✓ Production environment is ready!" >> production-deployment-report.txt
          break
        fi
        echo "  Health check attempt $i failed (HTTP $response_code), retrying..." >> production-deployment-report.txt
        sleep 10
      done

      if [ "$response_code" != "200" ]; then
        echo "✗ CRITICAL: Production health check FAILED" >> production-deployment-report.txt
        exit 1
      fi
    - |
      echo "✓ PRODUCTION DEPLOYMENT SUCCESSFUL!"
      echo "Production deployment completed: $(date)" >> production-deployment-report.txt
      echo "Access production at: https://${PRODUCTION_FQDN}"
  artifacts:
    when: always
    paths:
      - production-deployment-report.txt
    expire_in: 1 week

stop-production:
  extends: .deploy_production_base
  when: manual
  allow_failure: true
  environment:
    name: production
    action: stop
  script:
    - |
      echo "Stopping production environment" > production-stop-report.txt

      PRODUCTION_WEBAPP_NAME="${AZURE_WEBAPP_NAME}"

      echo "Stopping production Container App: $PRODUCTION_WEBAPP_NAME" >> production-stop-report.txt

      if az containerapp show --name "$PRODUCTION_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
        echo "✓ Found Container App - stopping..."
        az containerapp stop \
          --name "$PRODUCTION_WEBAPP_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" >> production-stop-report.txt 2>&1
      else
        echo "✓ Production Container App already stopped" >> production-stop-report.txt
      fi

      echo "Production stop completed: $(date)" >> production-stop-report.txt


# =====================================================
# PAGES - Static Landing Page (GitLab Pages)
# =====================================================
# Publishes landing/ as the GitLab Pages site for this project.
# Once a custom domain is attached in Settings > Pages, this becomes
# the site served at the domain apex (ml-visualizer.at) while the
# Streamlit app itself keeps running unchanged on its own subdomain.

pages:
  stage: pages
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - mkdir -p public
    - cp -r landing/. public/
  artifacts:
    paths:
      - public

# =====================================================
# CLEANUP STAGE - Environment Auto-Stop
# =====================================================
# Automatic cleanup of staging environments

cleanup-review:
  stage: cleanup
  image: mcr.microsoft.com/azure-cli:latest
  rules:
    # Run only for closed/merged merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_STATE == "closed"'
  before_script:
    - |
      az login --service-principal \
        --username "$AZURE_CLIENT_ID" \
        --password "$AZURE_CLIENT_SECRET" \
        --tenant "$AZURE_TENANT_ID"

      az account set --subscription "$AZURE_SUBSCRIPTION_ID"
  script:
    - |
      echo "Cleaning up staging environments..."

      REVIEW_APP_NAME="${AZURE_WEBAPP_NAME}-staging-${CI_COMMIT_SHORT_SHA}"

      if az containerapp show --name "$REVIEW_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1; then
        echo "✓ Deleting orphaned staging app: $REVIEW_APP_NAME"
        az containerapp delete \
          --name "$REVIEW_APP_NAME" \
          --resource-group "$AZURE_RESOURCE_GROUP" \
          --yes 2>&1 || echo "✓ Already deleted or in deletion process"
      else
        echo "✓ Staging app $REVIEW_APP_NAME not found (already cleaned up)"
      fi
  allow_failure: true
